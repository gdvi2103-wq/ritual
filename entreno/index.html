<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="theme-color" content="#000000">
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --card:#1C1C1E;
  --card-2:#2C2C2E;
  --fill:rgba(118,118,128,.24);
  --line:rgba(84,84,88,.6);
  --ink:#fff;
  --ink-2:rgba(235,235,245,.6);
  --ink-3:rgba(235,235,245,.3);
  --acc:#30D158;
  --acc-ink:#000;
  --red:#FF453A;
  --blue:#0A84FF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{margin:0;height:100%;background:var(--bg);}
body{font:400 17px/22px var(--font);letter-spacing:-.022em;color:var(--ink);
  position:fixed;inset:0;overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;touch-action:manipulation;}
input{font:inherit;color:inherit;background:none;border:0;outline:none;font-size:17px;letter-spacing:inherit;-webkit-user-select:text;user-select:text;min-width:0;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px;}
svg{width:1em;height:1em;flex:none;}

/* ── layout ── */
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px);}
.view>.in{max-width:560px;margin:0 auto;}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 18px;}
h1{font:700 34px/41px var(--font);letter-spacing:-.03em;margin:0;}
.sub{color:var(--ink-2);font-size:15px;line-height:20px;margin-top:2px;}
.sub::first-letter{text-transform:uppercase;}
h2{font:600 22px/28px var(--font);letter-spacing:-.025em;margin:28px 4px 10px;}
.cap{font-size:13px;line-height:18px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.02em;margin:24px 16px 7px;}
.foot{font-size:13px;line-height:18px;color:var(--ink-2);margin:7px 16px 0;}

/* ── icon buttons ── */
.ib{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:19px;color:var(--acc);}
.ib:active{opacity:.6;}

/* ── cards & lists ── */
.card{background:var(--card);border-radius:var(--r);overflow:hidden;}
.card+.card{margin-top:12px;}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left;}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line);}
button.row:active,.row.tap:active{background:var(--card-2);}
.row .grow{flex:1;min-width:0;}
.row .t{font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .s{font-size:15px;line-height:20px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .v{color:var(--ink-2);font-variant-numeric:tabular-nums;}
.chev{color:var(--ink-3);font-size:14px;}
.row input{flex:1;text-align:right;color:var(--ink-2);}
.row input.l{text-align:left;color:var(--ink);}

/* ── buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:var(--r);
  font-weight:600;background:var(--acc);color:var(--acc-ink);width:100%;transition:transform .15s,opacity .15s;}
.btn:active{transform:scale(.98);opacity:.85;}
.btn.g{background:var(--card);color:var(--acc);}
.btn.r{background:var(--card);color:var(--red);}
.btn.sm{height:36px;width:auto;padding:0 16px;border-radius:18px;font-size:15px;}
.link{color:var(--acc);font-size:17px;}
.link:active{opacity:.5;}
.link.r{color:var(--red);}
.btns{display:flex;gap:10px;margin-top:12px;}

/* ── tab bar ── */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);
  background:rgba(22,22,24,.78);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.12);}
#tabs button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;
  font-size:10px;line-height:12px;font-weight:500;color:#8E8E93;letter-spacing:.01em;}
#tabs button svg{font-size:25px;}
#tabs button.on{color:var(--acc);}

/* ── hoy: pasos ── */
.steps{display:flex;align-items:center;gap:18px;padding:18px 16px 16px;}
.ring{position:relative;width:92px;height:92px;flex:none;}
.ring svg{width:92px;height:92px;transform:rotate(-90deg);}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.big{font:700 34px/38px var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.unit{font-size:15px;color:var(--ink-2);margin-left:4px;font-weight:500;letter-spacing:0;}
.bars{display:flex;align-items:flex-end;gap:8px;height:64px;padding:0 16px;}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.bars .b i{display:block;width:100%;max-width:26px;border-radius:5px;background:var(--card-2);min-height:4px;}
.bars .b i.ok{background:var(--acc);}
.bars .b span{font-size:11px;line-height:13px;color:var(--ink-3);}
.bars .b.td span{color:var(--ink);font-weight:600;}
.sact{display:flex;gap:8px;padding:14px 16px 16px;}
.sact .btn{height:38px;font-size:15px;border-radius:12px;background:var(--fill);color:var(--ink);font-weight:500;}
.sact .btn.hot{background:var(--acc);color:var(--acc-ink);font-weight:600;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);}
.stats div{padding:14px 16px;}
.stats div+div{box-shadow:inset .5px 0 0 var(--line);}
.stats b{display:block;font:600 22px/28px var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.stats span{font-size:13px;color:var(--ink-2);}

.live{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--acc);color:var(--acc-ink);border-radius:var(--r);width:100%;text-align:left;margin-bottom:12px;}
.live .grow{flex:1;}
.live .t{font-weight:600;}
.live .s{font-size:15px;opacity:.75;font-variant-numeric:tabular-nums;}
.play{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:13px;flex:none;}

/* ── segmented ── */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:16px;}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;}
.seg button.on{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12);font-weight:600;}

/* ── full screen page ── */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .45s var(--ease);}
.page.on{transform:none;}
.page.up{transform:translateY(100%);}
.page.up.on{transform:none;}
.ph{flex:none;padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:calc(env(safe-area-inset-top) + 50px);
  background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 -.5px 0 var(--line);z-index:2;}
.ph .ttl{flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph .side{min-width:76px;display:flex;}
.ph .side.r{justify-content:flex-end;}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:16px 16px calc(env(safe-area-inset-bottom) + 120px);}
.pb>.in{max-width:560px;margin:0 auto;}

/* ── exercise blocks (session + editor) ── */
.ex{background:var(--card);border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.exh{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;}
.exh .nm{flex:1;min-width:0;font-weight:600;font-size:17px;}
.exh input.nm{color:var(--ink);font-weight:600;}
.exh .more{color:var(--ink-2);font-size:20px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;}
.exh .more:active{background:var(--fill);}
.prev{padding:0 16px 8px;font-size:13px;color:var(--ink-2);}
.sg{display:grid;grid-template-columns:28px 1fr 1fr 1fr 40px;gap:8px;align-items:center;padding:4px 12px 4px 16px;}
.sg.hd{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;padding-top:2px;padding-bottom:2px;}
.sg.hd span{text-align:center;}
.sg .n{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:15px;text-align:center;}
.sg input{height:36px;border-radius:9px;background:var(--fill);text-align:center;font-variant-numeric:tabular-nums;width:100%;font-weight:500;}
.sg input::placeholder{color:var(--ink-3);}
.ck{width:36px;height:36px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--ink-3);font-size:17px;transition:background .2s,color .2s,transform .15s;}
.ck:active{transform:scale(.9);}
.sg.done{background:rgba(48,209,88,.10);}
.sg.done .ck{background:var(--acc);color:var(--acc-ink);}
.sg.done input{background:transparent;}
.del{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--red);font-size:16px;}
.del:active{background:var(--fill);}
.exf{display:flex;justify-content:space-between;padding:8px 16px 14px;}
.exf button{font-size:15px;color:var(--acc);font-weight:500;}
.exf button.r{color:var(--red);}
.exf button:active{opacity:.5;}

/* timer pill */
#rest{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:45;transform:translate(-50%,140%);
  transition:transform .4s var(--ease);display:flex;align-items:center;gap:6px;padding:6px;border-radius:30px;
  background:rgba(44,44,46,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.5);}
#rest.on{transform:translate(-50%,0);}
#rest .tm{font:600 22px/28px var(--font);font-variant-numeric:tabular-nums;min-width:84px;text-align:center;}
#rest button{height:40px;padding:0 14px;border-radius:20px;background:var(--fill);font-size:15px;font-weight:500;}
#rest button.go{background:var(--acc);color:var(--acc-ink);}
#rest.end .tm{color:var(--acc);}

/* ── sheet ── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .35s;}
#scrim.on{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92%;display:flex;flex-direction:column;
  background:#1C1C1E;border-radius:14px 14px 0 0;transform:translateY(102%);transition:transform .45s var(--ease);}
#sheet.on{transform:none;}
#sheet .gb{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:6px auto 0;}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;}
#sheet .sh h3{margin:0;font:600 20px/25px var(--font);letter-spacing:-.02em;}
#sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(env(safe-area-inset-bottom) + 20px);}
#sheet .sb>.in{max-width:560px;margin:0 auto;}
#sheet .card{background:#2C2C2E;}
#sheet .row+.row::before{background:rgba(84,84,88,.65);}
#sheet .sg input,#sheet .seg{background:rgba(118,118,128,.3);}
.x{width:30px;height:30px;border-radius:50%;background:rgba(118,118,128,.3);display:grid;place-items:center;color:var(--ink-2);font-size:13px;}

.empty{text-align:center;color:var(--ink-2);padding:40px 20px;font-size:15px;line-height:21px;}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 16px;}
.kpi div{background:#2C2C2E;border-radius:12px;padding:12px;}
.kpi b{display:block;font:700 22px/28px var(--font);font-variant-numeric:tabular-nums;}
.kpi span{font-size:13px;color:var(--ink-2);}
.chart{background:#2C2C2E;border-radius:12px;padding:12px 12px 8px;margin-bottom:16px;}
.chart svg{width:100%;height:140px;display:block;}
.steps-list{counter-reset:s;margin:0;padding:0;list-style:none;}
.steps-list li{position:relative;padding:8px 0 8px 32px;font-size:15px;line-height:20px;color:var(--ink);}
.steps-list li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;
  background:var(--fill);font-size:13px;line-height:22px;text-align:center;color:var(--ink-2);}
.steps-list b{font-weight:600;}
.note{font-size:13px;line-height:18px;color:var(--ink-2);}
.pr{display:inline-block;font-size:11px;font-weight:700;color:var(--acc-ink);background:var(--acc);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px;}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:80;transform:translate(-50%,-160%);transition:transform .4s var(--ease);
  background:rgba(44,44,46,.95);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:10px 18px;border-radius:22px;font-size:15px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.4);white-space:nowrap;}
#toast.on{transform:translate(-50%,0);}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;}}
</style>
</head>

<main class="view" id="v-hoy"><div class="in"></div></main>
<main class="view" id="v-rut" hidden><div class="in"></div></main>
<main class="view" id="v-hist" hidden><div class="in"></div></main>

<nav id="tabs">
  <button data-tab="hoy" class="on"><svg><use href="#i-today"/></svg>Hoy</button>
  <button data-tab="rut"><svg><use href="#i-dumb"/></svg>Rutinas</button>
  <button data-tab="hist"><svg><use href="#i-hist"/></svg>Historial</button>
</nav>

<section class="page up" id="p-ses">
  <header class="ph">
    <div class="side"><button class="link" data-act="ses-menu">Opciones</button></div>
    <div class="ttl"><div id="ses-name" style="font-weight:600"></div><div id="ses-time" style="font-size:13px;color:var(--ink-2);font-weight:400;font-variant-numeric:tabular-nums"></div></div>
    <div class="side r"><button class="btn sm" data-act="ses-finish">Terminar</button></div>
  </header>
  <div class="pb"><div class="in" id="ses-body"></div></div>
</section>

<section class="page" id="p-edit">
  <header class="ph">
    <div class="side"><button class="link" data-act="edit-cancel">Cancelar</button></div>
    <div class="ttl" id="edit-title">Rutina</div>
    <div class="side r"><button class="link" style="font-weight:600" data-act="edit-save">Guardar</button></div>
  </header>
  <div class="pb"><div class="in" id="edit-body"></div></div>
</section>

<div id="rest"><button data-act="rest-sub">−15</button><div class="tm" id="rest-tm">1:30</div><button data-act="rest-add">+15</button><button class="go" data-act="rest-skip">Saltar</button></div>

<div id="scrim"></div>
<aside id="sheet" role="dialog" aria-modal="true">
  <div class="gb"></div>
  <div class="sh"><h3 id="sh-t"></h3><button class="x" data-act="sheet-close" aria-label="Cerrar"><svg><use href="#i-x"/></svg></button></div>
  <div class="sb"><div class="in" id="sh-b"></div></div>
</aside>

 ["Torso A2",[

/* ───────── utilidades ───────── */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function ic(n){return '<svg><use href="#i-'+n+'"/></svg>';}
function num(v){if(v==null)return null;v=String(v).trim().replace(",",".");if(v==="")return null;var n=parseFloat(v);return isFinite(n)?n:null;}
function fmt(n){if(n==null||n==="")return "";return (Math.round(n*100)/100).toLocaleString("es-ES");}
function fmtInt(n){return Math.round(n||0).toLocaleString("es-ES");}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function pad(n){return n<10?"0"+n:""+n;}
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function clock(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+pad(m):m)+":"+pad(s);}
function dur(ms){var m=Math.round(ms/60000);return m<60?m+" min":Math.floor(m/60)+" h "+pad(m%60);}
function clone(o){return JSON.parse(JSON.stringify(o));}
var DF_DAY=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"});
var DF_SHORT=new Intl.DateTimeFormat("es-ES",{weekday:"short",day:"numeric",month:"short"});
var DF_MON=new Intl.DateTimeFormat("es-ES",{month:"long",year:"numeric"});
function rel(t){var d=Math.floor((new Date(dkey()).getTime()-new Date(dkey(new Date(t))).getTime())/864e5);
  return d<=0?"hoy":d===1?"ayer":d<7?"hace "+d+" días":d<14?"hace 1 semana":"hace "+Math.floor(d/7)+" semanas";}
function vol(sets){return sets.reduce(function(a,s){return a+(s.kg||0)*(s.r||0);},0);}
function e1rm(s){return (s.kg||0)*(1+(s.r||0)/30);}
var toastT;
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},2000);}
function routine(id){for(var i=0;i<S.routines.length;i++)if(S.routines[i].id===id)return S.routines[i];return null;}
function lastDone(rid){for(var i=S.sessions.length-1;i>=0;i--)if(S.sessions[i].rid===rid)return S.sessions[i].end;return 0;}
function lastFor(name){for(var i=S.sessions.length-1;i>=0;i--){var se=S.sessions[i];
  for(var j=0;j<se.ex.length;j++)if(se.ex[j].name.toLowerCase()===name.toLowerCase())return {t:se.end,sets:se.ex[j].sets};}return null;}
function setsTxt(sets){return sets.map(function(s){return (s.kg!=null?fmt(s.kg)+"×":"")+(s.r!=null?s.r:"–")+(s.rir!=null?" @"+fmt(s.rir):"");}).join(" · ");}

var actx=null;
function unlock(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();var b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){}}
document.addEventListener("touchend",unlock,{once:true});document.addEventListener("click",unlock,{once:true});
function beep(){try{if(!actx)return;[0,.22,.44].forEach(function(o){var g=actx.createGain(),os=actx.createOscillator();os.type="sine";os.frequency.value=880;
  g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);
  os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}

var awaitSteps=false;
function rHoy(){
  var now=new Date(),today=dkey(now),st=S.steps[today]||0,goal=S.goal||10000,p=Math.min(1,st/goal);
  var C=2*Math.PI*40,h="";
  h+='<div class="top"><div><h1>Hoy</h1><div class="sub">'+esc(DF_DAY.format(now))+'</div></div><button class="ib" data-act="settings" aria-label="Ajustes">'+ic("gear")+'</button></div>';
  if(S.active){var a=S.active;h+='<button class="live" data-act="ses-open"><div class="grow"><div class="t">'+esc(a.name)+' en curso</div><div class="s" data-live>'+clock((Date.now()-a.start)/1000)+'</div></div><span style="font-size:15px;font-weight:600">Continuar ›</span></button>';}
  // pasos
  h+='<div class="card"><div class="steps"><div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="#2C2C2E" stroke-width="10"/>'+(p>0?'<circle cx="46" cy="46" r="40" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(C*p)+' '+C+'"/>':'')+'</svg><div class="c">'+Math.round(p*100)+'%</div></div>'
    +'<div style="flex:1;min-width:0"><div style="font-size:15px;color:var(--ink-2)">Pasos</div><div class="big">'+fmtInt(st)+'</div><div style="font-size:13px;color:var(--ink-2)">Objetivo '+fmtInt(goal)+'</div></div></div>';
  var days=[],mx=goal;for(var i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var k=dkey(d),v=S.steps[k]||0;mx=Math.max(mx,v);days.push({k:k,v:v,l:"LMXJVSD"[(d.getDay()+6)%7]});}
  h+='<div class="bars">'+days.map(function(x){return '<div class="b'+(x.k===today?" td":"")+'"><i class="'+(x.v>=goal?"ok":"")+'" style="height:'+Math.max(4,x.v/mx*46)+'px"></i><span>'+x.l+'</span></div>';}).join("")+'</div>';
  h+='<div class="sact"><button class="btn'+(awaitSteps?"":" hot")+'" data-act="steps-sync">'+ic("heart")+' Traer de Salud</button>'+(awaitSteps?'<button class="btn hot" data-act="steps-paste">Pegar pasos</button>':'<button class="btn" data-act="steps-edit">A mano</button>')+'</div></div>';
  // semana
  var wk=new Date(now);wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
  var ws=S.sessions.filter(function(s){return s.start>=wk.getTime();}),sets=0,v=0;
  ws.forEach(function(s){s.ex.forEach(function(e){sets+=e.sets.length;v+=vol(e.sets);});});
  h+='<div class="cap">Esta semana</div><div class="card stats"><div><b>'+ws.length+'</b><span>Entrenos</span></div><div><b>'+sets+'</b><span>Series</span></div><div><b>'+(v>=1000?fmt(Math.round(v/100)/10)+"t":fmtInt(v)+"kg")+'</b><span>Volumen</span></div></div>';
  // siguiente
  var gym=S.routines.slice().sort(function(a,b){return lastDone(a.id)-lastDone(b.id);});
  h+='<div class="cap">Empezar</div><div class="card">'+gym.map(function(r){var t=lastDone(r.id);
    return '<button class="row" data-act="start" data-id="'+r.id+'"><div class="grow"><div class="t">'+esc(r.name)+'</div><div class="s">'+r.ex.length+' ejercicios · '+(t?rel(t):"sin hacer")+'</div></div><span class="play">'+ic("play")+'</span></button>';}).join("")+'</div>';
  $("v-hoy").firstChild.innerHTML=h;
}

/* ───────── SESIÓN ───────── */
var tick=null;
function start(id){
  if(S.active){if(!confirm("Ya tienes un entreno en curso. ¿Descartarlo y empezar otro?"))return;}
  var r=routine(id);if(!r)return;
  S.active={rid:r.id,name:r.name,start:Date.now(),restEnd:0,ex:r.ex.map(function(e){return {name:e.name,sets:e.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir,done:false};})};})};
  save();closeSheet();openSes();
}
function openSes(){rSes();openPage("p-ses");startTick();}
function rSes(){var a=S.active;if(!a)return;
  $("ses-name").textContent=a.name;
  var h=a.ex.map(function(e,i){return exBlock(e,i,true);}).join("");
  h+='<button class="btn g" data-act="ex-add">'+ic("plus")+' Añadir ejercicio</button>';
  $("ses-body").innerHTML=h;updTime();
}
function startTick(){if(tick)return;tick=setInterval(updTime,500);}
function updTime(){var a=S.active;
  if(!a){clearInterval(tick);tick=null;$("rest").classList.remove("on");return;}
  var el=clock((Date.now()-a.start)/1000);$("ses-time").textContent=el;
  var lv=document.querySelector("[data-live]");if(lv)lv.textContent=el;
  var rest=$("rest");
  if(a.restEnd){var left=(a.restEnd-Date.now())/1000;
    if(left<=0&&!rest.classList.contains("end")){rest.classList.add("end");beep();}
    $("rest-tm").textContent=left>0?clock(left):"¡Ya!";
    if(left<-6){a.restEnd=0;save();}
    rest.classList.toggle("on",!!a.restEnd&&$("p-ses").classList.contains("on"));
  }else rest.classList.remove("on","end");
}
function setRest(sec){var a=S.active;a.restEnd=Date.now()+sec*1000;$("rest").classList.remove("end");save();updTime();}
function finish(){var a=S.active;if(!a)return;
  var done=a.ex.map(function(e){return {name:e.name,sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {kg:s.kg,r:s.r,rir:s.rir};})};}).filter(function(e){return e.sets.length;});
  if(!done.length){if(confirm("No has marcado ninguna serie. ¿Descartar el entreno?")){S.active=null;save();closePage("p-ses");updTime();render();}return;}
  // récords: mejor 1RM estimado frente al historial anterior
  var prs=[];done.forEach(function(e){var best=0;S.sessions.forEach(function(se){se.ex.forEach(function(x){if(x.name.toLowerCase()===e.name.toLowerCase())x.sets.forEach(function(s){best=Math.max(best,e1rm(s));});});});
    var now=Math.max.apply(null,e.sets.map(e1rm));if(best>0&&now>best+.01)prs.push(e.name);});
  var se={id:uid(),rid:a.rid,name:a.name,start:a.start,end:Date.now(),ex:done};
  S.sessions.push(se);
  // la rutina guarda los últimos valores como nuevo objetivo
  var r=routine(a.rid);if(r){r.ex=a.ex.map(function(e,i){var old=r.ex.filter(function(x){return x.name===e.name;})[0];
    return {id:old?old.id:uid(),name:e.name,sets:e.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir};})};});}
  S.active=null;save();updTime();closePage("p-ses");show("hoy");
  summary(se,prs);
}
function summary(se,prs){var sets=0,v=0;se.ex.forEach(function(e){sets+=e.sets.length;v+=vol(e.sets);});
  var h='<div class="kpi"><div><b>'+dur(se.end-se.start)+'</b><span>Duración</span></div><div><b>'+sets+'</b><span>Series</span></div><div><b>'+fmtInt(v)+'</b><span>kg totales</span></div></div>';
  if(prs&&prs.length)h+='<div class="card" style="margin-bottom:16px"><div class="row"><div class="grow"><div class="t">🏆 Récords</div><div class="s" style="white-space:normal">'+esc(prs.join(", "))+'</div></div></div></div>';
  h+='<button class="btn" data-act="health" data-id="'+se.id+'">'+ic("heart")+' Guardar en Salud</button>';
  h+='<p class="foot">Necesita el atajo «Entreno a Salud». Mira Ajustes › Conectar con Salud.</p>';
  h+='<div class="btns"><button class="btn g" data-act="sheet-close">Hecho</button></div>';
  sheet("¡Buen entreno!",h);
}
function toHealth(id){var se=S.sessions.filter(function(s){return s.id===id;})[0];if(!se)return;
  var d=new Date(se.start),payload={nombre:se.name,inicio:dkey(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes()),minutos:Math.max(1,Math.round((se.end-se.start)/60000))};

  else if(histSeg==="ses"){var list=S.sessions.slice().reverse(),cur="",open=false;
    list.forEach(function(s){var m=DF_MON.format(new Date(s.start));
      if(m!==cur){if(open)h+='</div>';h+='<div class="cap" style="text-transform:capitalize">'+esc(m)+'</div><div class="card">';cur=m;open=true;}
      var n=0,v=0;s.ex.forEach(function(e){n+=e.sets.length;v+=vol(e.sets);});
      h+='<button class="row" data-act="hses" data-id="'+s.id+'"><div class="grow"><div class="t">'+esc(s.name)+'</div><div class="s">'+esc(cap1(DF_SHORT.format(new Date(s.start))))+' · '+dur(s.end-s.start)+' · '+n+' series · '+fmtInt(v)+' kg</div></div><span class="chev">'+ic("r")+'</span></button>';});
    if(open)h+='</div>';}
  else{var map={};S.sessions.forEach(function(s){s.ex.forEach(function(e){var k=e.name.toLowerCase();if(!map[k])map[k]={name:e.name,n:0,best:null,t:0};
      map[k].n++;map[k].t=s.end;e.sets.forEach(function(x){if(!map[k].best||e1rm(x)>e1rm(map[k].best))map[k].best=x;});});});
    var arr=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,"es");});
    h+='<div class="card">'+arr.map(function(x){return '<button class="row" data-act="hex" data-id="'+esc(x.name)+'"><div class="grow"><div class="t">'+esc(x.name)+'</div><div class="s">Mejor: '+esc(setsTxt([x.best]))+' · '+x.n+(x.n===1?' sesión':' sesiones')+'</div></div><span class="chev">'+ic("r")+'</span></button>';}).join("")+'</div>';}
  $("v-hist").firstChild.innerHTML=h;
}
function sesSheet(id){var s=S.sessions.filter(function(x){return x.id===id;})[0];if(!s)return;
  var n=0,v=0;s.ex.forEach(function(e){n+=e.sets.length;v+=vol(e.sets);});
  var h='<div class="sub" style="margin:-2px 0 12px">'+esc(DF_DAY.format(new Date(s.start)))+'</div>';
  h+='<div class="kpi"><div><b>'+dur(s.end-s.start)+'</b><span>Duración</span></div><div><b>'+n+'</b><span>Series</span></div><div><b>'+fmtInt(v)+'</b><span>kg totales</span></div></div>';
  h+='<div class="card">'+s.ex.map(function(e){return '<button class="row" data-act="hex" data-id="'+esc(e.name)+'"><div class="grow"><div class="t">'+esc(e.name)+'</div><div class="s" style="white-space:normal">'+esc(setsTxt(e.sets))+'</div></div><span class="chev">'+ic("r")+'</span></button>';}).join("")+'</div>';
  h+='<div class="btns"><button class="btn g" data-act="health" data-id="'+s.id+'">'+ic("heart")+' A Salud</button><button class="btn r" data-act="del-ses" data-id="'+s.id+'">Eliminar</button></div>';
  sheet(s.name,h);
}
function exSheet(name){var pts=[],rows=[];
  S.sessions.forEach(function(s){s.ex.forEach(function(e){if(e.name.toLowerCase()!==name.toLowerCase())return;
    var b=e.sets.reduce(function(a,x){return e1rm(x)>e1rm(a)?x:a;},e.sets[0]);pts.push({t:s.start,v:e1rm(b)});rows.push({t:s.start,sets:e.sets});});});
  var h="";
  if(pts.length>1){var W=320,H=140,P=10,mn=Math.min.apply(null,pts.map(function(p){return p.v;})),mx=Math.max.apply(null,pts.map(function(p){return p.v;}));if(mx===mn){mx+=1;mn-=1;}
    var xy=pts.map(function(p,i){return [P+i*(W-2*P)/(pts.length-1),H-P-(p.v-mn)/(mx-mn)*(H-2*P)];});
    var line=xy.map(function(q,i){return (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);}).join("");
    h+='<div class="chart"><div class="note" style="margin-bottom:6px">1RM estimado (kg)</div><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+line+' L'+xy[xy.length-1][0]+' '+H+' L'+xy[0][0]+' '+H+'Z" fill="rgba(48,209,88,.15)"/><path d="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
      +xy.map(function(q){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.5" fill="var(--acc)"/>';}).join("")+'</svg><div class="note" style="display:flex;justify-content:space-between;margin-top:4px"><span>'+fmt(Math.round(mn))+'</span><span>'+fmt(Math.round(mx))+'</span></div></div>';}
  h+='<div class="card">'+rows.reverse().map(function(r){return '<div class="row"><div class="grow"><div class="s">'+esc(cap1(DF_SHORT.format(new Date(r.t))))+'</div><div class="t" style="white-space:normal;font-size:15px">'+esc(setsTxt(r.sets))+'</div></div></div>';}).join("")+'</div>';
  sheet(name,h);
}

/* ───────── AJUSTES ───────── */
function settings(){
  var h='<div class="card"><div class="row"><div class="grow">Objetivo de pasos</div><input inputmode="numeric" id="set-goal" value="'+S.goal+'"></div>'
   +'<div class="row"><div class="grow">Descanso entre series (s)</div><input inputmode="numeric" id="set-rest" value="'+S.rest+'"></div></div>';
  h+='<div class="cap">Conectar con Salud</div><div class="card"><div class="row" style="display:block">'
   +'<p class="note" style="margin:2px 0 8px">Una web no puede leer Salud directamente. Con dos atajos de la app <b>Atajos</b> se conecta en un toque. Créalos una vez:</p>'
   +'<div style="font-weight:600;margin-top:10px">1 · Atajo «Pasos Entreno»</div><ol class="steps-list">'
   +'<li>Nuevo atajo → acción <b>Buscar muestras de salud</b>: tipo <b>Pasos</b>, fecha de inicio <b>es hoy</b>.</li>'
   +'<li>Acción <b>Calcular estadísticas</b> → <b>Suma</b>.</li>'
   +'<li>Acción <b>Redondear número</b>.</li>'
   +'<li>Acción <b>Copiar al portapapeles</b>.</li>'
   +'<li>Llámalo exactamente <b>Pasos Entreno</b>.</li></ol>'
   +'<p class="note">En Hoy, toca «Traer de Salud», vuelve a Entreno con «◀ Entreno» arriba a la izquierda y toca «Pegar pasos».</p>'
   +'<div style="font-weight:600;margin-top:14px">2 · Atajo «Entreno a Salud»</div><ol class="steps-list">'
   +'<li>Nuevo atajo → acción <b>Obtener diccionario de</b> la entrada del atajo.</li>'
   +'<li>Acción <b>Registrar entrenamiento</b>: tipo <b>Fuerza tradicional</b>; inicio = valor de <b>inicio</b>; duración = valor de <b>minutos</b> (en minutos).</li>'
   +'<li>Llámalo exactamente <b>Entreno a Salud</b>.</li></ol>'
   +'<p class="note">Al terminar un entreno, «Guardar en Salud» lo registra como entrenamiento de fuerza y cuenta para tus anillos.</p>'
   +'</div></div>';
  h+='<div class="cap">Datos</div><div class="card"><button class="row" data-act="export"><div class="grow">Exportar copia (JSON)</div></button><button class="row" data-act="import"><div class="grow">Importar copia</div></button><button class="row" data-act="reset"><div class="grow" style="color:var(--red)">Borrar todo y restaurar rutinas</div></button></div>';
  h+='<p class="foot">Tus datos se guardan solo en este iPhone. Exporta una copia de vez en cuando.</p>';
  sheet("Ajustes",h);
  $("set-goal").addEventListener("change",function(){var n=num(this.value);if(n>0){S.goal=Math.round(n);save();render();}});
  $("set-rest").addEventListener("change",function(){var n=num(this.value);if(n>0){S.rest=Math.round(n);save();}});
}
function exportData(){var json=JSON.stringify(S,null,1),name="entreno-"+dkey()+".json";
  try{var f=new File([json],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return;}}catch(e){}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
$("fin").addEventListener("change",function(){var f=this.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.routines)throw 0;S=o;save();closeSheet();render();toast("Copia importada");}catch(e){toast("Archivo no válido");}};rd.readAsText(f);this.value="";});

/* ───────── pasos ───────── */
function setSteps(n){S.steps[dkey()]=Math.round(n);save();awaitSteps=false;render();toast(fmtInt(n)+" pasos");}
function stepsEdit(){var h='<div class="card"><div class="row"><div class="grow">Pasos de hoy</div><input inputmode="numeric" id="st-in" value="'+(S.steps[dkey()]||"")+'" placeholder="0"></div></div><div class="btns"><button class="btn" data-act="steps-save">Guardar</button></div>';
  sheet("Pasos",h);setTimeout(function(){var i=$("st-in");i&&i.focus();},350);}
document.addEventListener("visibilitychange",function(){if(!document.hidden){if(tab==="hoy")rHoy();updTime();}});

/* ───────── páginas y hoja ───────── */
function openPage(id){$(id).classList.add("on");}
function closePage(id){$(id).classList.remove("on");}
function sheet(title,html){$("sh-t").textContent=title;$("sh-b").innerHTML=html;$("sheet").scrollTop=0;$("scrim").classList.add("on");$("sheet").classList.add("on");}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");}
$("scrim").addEventListener("click",closeSheet);

/* contexto de ejercicio: sesión o editor */
function ctx(el){var inSes=!!el.closest("#p-ses");return {live:inSes,list:inSes?(S.active&&S.active.ex):(ED&&ED.ex),rerender:inSes?rSes:rEdit};}
function exMenu(i,live){var c=live?S.active.ex:ED.ex,e=c[i];
  var h='<div class="card"><div class="row"><input class="l" id="ren" value="'+esc(e.name)+'" placeholder="Nombre"></div></div>'
   +'<div class="card"><button class="row" data-act="mv" data-id="-1"><div class="grow">Subir</div></button><button class="row" data-act="mv" data-id="1"><div class="grow">Bajar</div></button>'
   +'<button class="row" data-act="ex-del"><div class="grow" style="color:var(--red)">Quitar ejercicio</div></button></div>';
  sheet(e.name||"Ejercicio",h);
  var menu={i:i,live:live};$("sh-b").dataset.menu=JSON.stringify(menu);
  $("ren").addEventListener("change",function(){var v=this.value.trim();if(v){c[i].name=v;if(live)save();(live?rSes:rEdit)();$("sh-t").textContent=v;}});
}
function addEx(live){var h='<div class="card"><div class="row"><input class="l" id="newex" placeholder="Nombre del ejercicio" enterkeyhint="done" list="exnames"></div></div>'
  +'<datalist id="exnames">'+allNames().map(function(n){return '<option value="'+esc(n)+'">';}).join("")+'</datalist>'
  +'<div class="btns"><button class="btn" data-act="ex-add-ok" data-id="'+(live?1:0)+'">Añadir</button></div>';
  sheet("Añadir ejercicio",h);setTimeout(function(){var i=$("newex");i&&i.focus();},350);}
function allNames(){var m={};S.routines.forEach(function(r){r.ex.forEach(function(e){m[e.name]=1;});});S.sessions.forEach(function(s){s.ex.forEach(function(e){m[e.name]=1;});});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,"es");});}

/* ───────── eventos ───────── */
document.addEventListener("input",function(ev){var t=ev.target;
  if(t.id==="ed-name"&&ED){ED.name=t.value;return;}
  var f=t.dataset.f;if(!f)return;var c=ctx(t),exEl=t.closest("[data-ex]");if(!c.list||!exEl)return;var e=c.list[+exEl.dataset.ex];
  if(f==="exname"){e.name=t.value;return;}
  var sEl=t.closest("[data-set]");if(!sEl)return;var s=e.sets[+sEl.dataset.set];
  s[f]=f==="r"?(num(t.value)==null?null:Math.round(num(t.value))):num(t.value);
  if(c.live)save();
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.tagName==="INPUT"){
  if(ev.target.id==="newex"){var b=document.querySelector('[data-act="ex-add-ok"]');b&&b.click();}
  else if(ev.target.id==="st-in"){var b2=document.querySelector('[data-act="steps-save"]');b2&&b2.click();}
  else ev.target.blur();}});

document.addEventListener("click",function(ev){
  var tb=ev.target.closest("#tabs button");if(tb){show(tb.dataset.tab);$("v-"+tab).scrollTop=0;return;}
  var b=ev.target.closest("[data-act]");if(!b)return;var act=b.dataset.act,id=b.dataset.id;
  var c,exEl,i;
  switch(act){
  case "settings":settings();break;
  case "sheet-close":closeSheet();break;
  case "start":start(id);break;
  case "ses-open":openSes();break;
  case "rut":rutSheet(id);break;
  case "new-rut":edit(null);break;
  case "edit":edit(id);break;
  case "edit-cancel":ED=null;closePage("p-edit");break;
  case "edit-save":saveEdit();break;
  case "dup":var r=routine(id);if(r){var n=clone(r);n.id=uid();n.name=r.name+" (copia)";n.ex.forEach(function(e){e.id=uid();});S.routines.push(n);save();closeSheet();render();toast("Rutina duplicada");}break;
  case "del-rut":if(confirm("¿Eliminar esta rutina? Tu historial se conserva.")){S.routines=S.routines.filter(function(r){return r.id!==id;});save();closeSheet();render();}break;
  case "set-done":
    c=ctx(b);exEl=b.closest("[data-ex]");var sEl=b.closest("[data-set]"),s=c.list[+exEl.dataset.ex].sets[+sEl.dataset.set];
    s.done=!s.done;sEl.classList.toggle("done",s.done);save();
    if(s.done)setRest(S.rest||90);
    break;
  case "set-add":c=ctx(b);exEl=b.closest("[data-ex]");var e=c.list[+exEl.dataset.ex],last=e.sets[e.sets.length-1];
    e.sets.push(last?{kg:last.kg,r:last.r,rir:last.rir,done:false}:{kg:null,r:null,rir:null,done:false});if(c.live)save();c.rerender();break;
  case "set-del":c=ctx(b);exEl=b.closest("[data-ex]");c.list[+exEl.dataset.ex].sets.splice(+b.closest("[data-set]").dataset.set,1);c.rerender();break;
  case "set-del-last":c=ctx(b);exEl=b.closest("[data-ex]");c.list[+exEl.dataset.ex].sets.pop();save();c.rerender();break;
  case "ex-menu":c=ctx(b);exMenu(+b.closest("[data-ex]").dataset.ex,c.live);break;
  case "mv":case "ex-del":
    var m=JSON.parse($("sh-b").dataset.menu||"{}"),L=m.live?S.active.ex:ED.ex;
    if(act==="mv"){var j=m.i+(+id);if(j>=0&&j<L.length){var tmp=L[m.i];L[m.i]=L[j];L[j]=tmp;}}
    else L.splice(m.i,1);
    if(m.live)save();(m.live?rSes:rEdit)();closeSheet();break;
  case "ex-add":c=ctx(b);addEx(c.live);break;
  case "ex-add-ok":var nm=($("newex").value||"").trim();if(!nm)return;var live=id==="1",tgt=live?S.active.ex:ED.ex;
    var src=null;S.routines.forEach(function(r){r.ex.forEach(function(e){if(!src&&e.name.toLowerCase()===nm.toLowerCase())src=e;});});
    tgt.push({id:uid(),name:nm,sets:src?src.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir,done:false};}):[{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false}]});
    if(live)save();(live?rSes:rEdit)();closeSheet();
    setTimeout(function(){var pb=b.closest(".page")||$(live?"p-ses":"p-edit");var sc=$(live?"p-ses":"p-edit").querySelector(".pb");sc.scrollTop=sc.scrollHeight;},50);break;
  case "ses-finish":finish();break;
  case "ses-menu":sheet("Entreno",'<div class="card"><button class="row" data-act="ses-min"><div class="grow">Minimizar</div></button><button class="row" data-act="ses-discard"><div class="grow" style="color:var(--red)">Descartar entreno</div></button></div>');break;
  case "ses-min":closeSheet();closePage("p-ses");render();break;
  case "ses-discard":if(confirm("¿Descartar este entreno? No se guardará.")){S.active=null;save();closeSheet();closePage("p-ses");updTime();render();}break;
  case "rest-add":if(S.active){S.active.restEnd=Math.max(S.active.restEnd,Date.now())+15000;$("rest").classList.remove("end");save();updTime();}break;
  case "rest-sub":if(S.active){S.active.restEnd-=15000;save();updTime();}break;
  case "rest-skip":if(S.active){S.active.restEnd=0;save();updTime();}break;
  case "health":toHealth(id);break;
  case "hseg":histSeg=id;rHist();break;
  case "hses":sesSheet(id);break;
  case "hex":exSheet(id);break;
  case "del-ses":if(confirm("¿Eliminar este entreno del historial?")){S.sessions=S.sessions.filter(function(s){return s.id!==id;});save();closeSheet();render();}break;
  case "steps-sync":awaitSteps=true;rHoy();location.href="shortcuts://run-shortcut?name="+encodeURIComponent("Pasos Entreno");break;
  case "steps-paste":
    if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){var mm=String(t).replace(/[.\s]/g,"").match(/\d+/);if(mm)setSteps(+mm[0]);else{toast("No hay pasos copiados");stepsEdit();}}).catch(function(){stepsEdit();});}
    else stepsEdit();break;
  case "steps-edit":stepsEdit();break;
  case "steps-save":var v=num($("st-in").value);if(v!=null&&v>=0){setSteps(v);closeSheet();}break;
  case "export":exportData();break;
  case "import":$("fin").click();break;
  case "reset":if(confirm("Se borrará todo tu historial y volverán las rutinas iniciales. ¿Seguro?")){S=seed();save();closeSheet();render();toast("Restaurado");}break;
  }
});

/* ───────── arranque ───────── */
render();
if(S.active){openSes();}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
