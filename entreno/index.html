<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="theme-color" content="#EDEDED">
<style>
:root{
  color-scheme:light;
  --bg:#EDEDED;
  --paper:#FFFFFF;
  --well:#F2F2F2;
  --well-2:#E3E3E3;
  --ink:#0A0A0B;
  --ink-2:#8A8A8F;
  --ink-3:#BDBDC2;
  --line:rgba(0,0,0,.06);
  /* islas negras */
  --isl:#000;
  --isl-2:#1B1B1D;
  --isl-3:#2A2A2D;
  --on:#fff;
  --on-2:rgba(255,255,255,.52);
  --on-3:rgba(255,255,255,.22);
  --red:#FF2A2A;
  --red-2:#FF6A3D;
  --glow:0 0 18px rgba(255,42,42,.55);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --rnd:"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:34px;
  --spring:cubic-bezier(.32,.72,0,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --lift:0 1px 2px rgba(0,0,0,.04),0 18px 40px -18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{margin:0;height:100%;background:var(--bg);}
body{font:400 17px/22px var(--font);letter-spacing:-.022em;color:var(--ink);
  position:fixed;inset:0;overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;touch-action:manipulation;}
input{font:inherit;color:inherit;background:none;border:0;outline:none;font-size:17px;letter-spacing:inherit;-webkit-user-select:text;user-select:text;min-width:0;}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:12px;}
svg{width:1em;height:1em;flex:none;}
.num{font-variant-numeric:tabular-nums;}
.press{transition:transform .35s var(--bounce);}
.press:active{transform:scale(.96);transition-duration:.08s;}

/* ── splash: destello de luz ── */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .5s ease .1s,visibility .6s;}
#splash.out{opacity:0;visibility:hidden;}
#splash .beam{position:absolute;left:50%;top:50%;width:150vw;height:110px;transform:translate(-50%,-50%) scaleX(.05);
  background:radial-gradient(50% 50% at 50% 50%,#fff 0%,#FFD0C8 6%,#FF3B30 18%,rgba(255,42,42,.35) 38%,rgba(255,42,42,0) 70%);
  filter:blur(6px);animation:beam 1.1s var(--spring) forwards;}
#splash .core{position:absolute;left:50%;top:50%;width:180px;height:16px;border-radius:50%;transform:translate(-50%,-50%) scaleX(.1);
  background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));animation:core 1.1s var(--spring) forwards;}
#splash .w{position:absolute;top:calc(50% + 70px);left:0;right:0;text-align:center;color:rgba(255,255,255,.5);font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:fadeup .6s ease .35s forwards;}
@keyframes beam{0%{transform:translate(-50%,-50%) scaleX(.02) scaleY(.4);opacity:0;}40%{opacity:1;}100%{transform:translate(-50%,-50%) scaleX(1) scaleY(1);opacity:1;}}
@keyframes core{0%{transform:translate(-50%,-50%) scaleX(.05);opacity:0;}50%{opacity:1;}100%{transform:translate(-50%,-50%) scaleX(1.4);opacity:.9;}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ── vistas ── */
.view{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 124px);}
.view>.in{max-width:560px;margin:0 auto;}
.enter>*{animation:rise .55s var(--spring) both;}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(n+7){animation-delay:.24s}
.grid.enter>*{animation:rise .6s var(--spring) both;}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985);}to{opacity:1;transform:none;}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 2px 18px;}
.eyebrow{font-size:13px;line-height:16px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;}
.eyebrow::first-letter{text-transform:uppercase;}
h1{font:800 38px/42px var(--font);letter-spacing:-.045em;margin:2px 0 0;}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 6px 12px;}
.sec h2{font:700 21px/26px var(--font);letter-spacing:-.03em;margin:0;}
.sec .lk{font-size:15px;color:var(--ink-2);font-weight:500;}
.foot{font-size:13px;line-height:18px;color:var(--ink-2);margin:10px 8px 0;}
/* botones cuadrados oscuros (estilo referencia) */
.sq{width:46px;height:46px;border-radius:16px;background:var(--isl);color:#fff;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 8px 20px -10px rgba(0,0,0,.6);}
.sq.l{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05);}

/* ── islas (tarjetas negras tipo Live Activity) ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.isl{background:var(--isl);color:var(--on);border-radius:var(--r);padding:18px;box-shadow:var(--lift);position:relative;overflow:hidden;text-align:left;width:100%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),var(--lift);}
.isl.w{grid-column:span 2;}
.isl .lab{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--on);}
.isl .lab svg{font-size:18px;color:var(--red);}
.isl .lab .dim{color:var(--on-2);font-weight:500;}
.isl .mut{color:var(--on-2);font-size:13px;line-height:17px;}
.hero{font:700 52px/54px var(--font);letter-spacing:-.05em;font-variant-numeric:tabular-nums;}
.mid{font:700 34px/38px var(--font);letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
.mid small,.hero small{font-size:16px;font-weight:600;color:var(--on-2);letter-spacing:-.01em;margin-left:4px;}
.pill{white-space:nowrap;flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--isl-3);color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.pill.red{background:var(--red);box-shadow:var(--glow);}
.pill svg{font-size:14px;}

/* pasos */
.steps{display:flex;gap:14px;align-items:stretch;}
.steps .l{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;}
.steps .r{width:132px;flex:none;background:var(--isl-2);border-radius:24px;padding:14px 12px 14px 10px;display:flex;gap:10px;}
.vtrack{position:relative;width:6px;border-radius:3px;background:var(--isl-3);flex:none;margin:4px 0;}
.vtrack .f{position:absolute;left:0;right:0;bottom:0;border-radius:3px;background:linear-gradient(0deg,var(--red),var(--red-2) 70%,#FFC14D);transition:height 1s var(--spring);}
.vtrack .k{position:absolute;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,42,42,.25),var(--glow);transition:bottom 1s var(--spring);transform:translateY(50%);}
.vtrack .k::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;}
.stack{display:flex;flex-direction:column;justify-content:space-between;flex:1;text-align:center;gap:8px;}
.stack b{display:block;font:700 22px/24px var(--font);letter-spacing:-.04em;font-variant-numeric:tabular-nums;}
.stack span{font-size:11px;line-height:13px;color:var(--on-2);font-weight:600;}
.bars{display:flex;align-items:flex-end;gap:6px;height:44px;}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.bars .b i{display:block;width:100%;max-width:16px;border-radius:5px;background:var(--isl-3);min-height:4px;transition:height .8s var(--spring);}
.bars .b i.ok{background:#fff;}
.bars .b.td i{background:var(--red);box-shadow:var(--glow);}
.bars .b span{font-size:10px;line-height:12px;color:var(--on-3);font-weight:700;}
.bars .b.td span{color:#fff;}

/* línea de metro: anterior · siguiente · después */
.line{position:relative;margin:22px 4px 0;height:12px;}
.line .tr{position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;border-radius:5px;background:rgba(255,42,42,.22);}
.line .tr i{position:absolute;left:0;top:0;bottom:0;width:50%;border-radius:5px;background:linear-gradient(90deg,#FF7A5C,var(--red));}
.line .st{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#000;}
.line .cur{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--red);background:rgba(255,42,42,.25);box-shadow:var(--glow);animation:breath 2.4s ease-in-out infinite;}
.line .cur::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff;}
@keyframes breath{50%{box-shadow:0 0 28px rgba(255,42,42,.8);}}
.stops{display:flex;justify-content:space-between;margin-top:12px;gap:8px;font-size:14px;font-weight:600;}
.stops span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#FF8A75;}
.stops span:nth-child(2){text-align:center;color:#fff;font-size:15px;}
.stops span:nth-child(3){text-align:right;color:var(--on-3);}

/* pasos semanales tipo stepper */
.stepper{display:flex;align-items:center;margin-top:16px;}
.stepper .d{width:17px;height:17px;border-radius:50%;border:2px solid var(--isl-3);display:grid;place-items:center;font-size:11px;color:#fff;flex:none;position:relative;}
.stepper .d.on{background:var(--red);border-color:var(--red);box-shadow:var(--glow);}
.stepper .d.td{border-color:#fff;}
.stepper .d svg{font-size:10px;}
.stepper .ln{flex:1;height:2px;border-radius:2px;background:var(--isl-3);margin:0 1px;min-width:2px;}
.stepper .ln.on{background:var(--red);}
.daylbl{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;font-weight:700;color:var(--on-3);}
.daylbl span{width:17px;text-align:center;}

/* volumen: barra de marcas */
.ticks{display:flex;gap:3px;align-items:center;height:30px;margin-top:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);}
.ticks i{flex:1;height:26px;border-radius:4px;background:var(--isl-3);}
.ticks i.f{background:linear-gradient(180deg,var(--red-2),var(--red));}

/* constancia */
.heat{display:flex;gap:2px;margin:14px 0 0;justify-content:space-between;}
.heat .col{display:flex;flex-direction:column;gap:3px;align-items:center;}
.heat .col b{font-size:10px;line-height:12px;color:var(--on-2);font-weight:700;height:14px;white-space:nowrap;width:8px;}
.heat i{width:8px;height:8px;border-radius:50%;background:var(--isl-3);display:block;margin:1px;}
.heat i.on{background:#fff;transform:scale(1.2);}
.heat i.td{background:var(--red);transform:scale(1.35);box-shadow:var(--glow);}
.heat i.fu{background:transparent;}

.live{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 18px;background:var(--isl);color:#fff;border-radius:28px;width:100%;text-align:left;margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),var(--lift);}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:var(--glow);animation:pulse 1.6s infinite;flex:none;}
@keyframes pulse{50%{opacity:.35;}}
.live .grow{flex:1;min-width:0;}
.live .t{font-weight:650;}
.live .s{font-size:13px;color:var(--on-2);}

/* ── listas claras ── */
.list{background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:13px 16px;position:relative;width:100%;text-align:left;transition:background .2s;}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line);}
button.row:active{background:var(--well);}
.row .grow{flex:1;min-width:0;}
.row .t{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .s{font-size:14px;line-height:19px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.chev{color:var(--ink-3);font-size:13px;}
.row input{flex:1;text-align:right;color:var(--ink-2);}
.row input.l{text-align:left;color:var(--ink);}
.play{width:40px;height:40px;border-radius:14px;background:var(--isl);color:#fff;display:grid;place-items:center;font-size:13px;flex:none;}
.badge{width:42px;height:42px;border-radius:14px;background:var(--isl);color:#fff;display:grid;place-items:center;font:700 16px/1 var(--font);flex:none;}
.badge.hot{background:var(--red);box-shadow:var(--glow);}

/* ── botones ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:20px;
  font-weight:650;background:var(--isl);color:#fff;width:100%;transition:transform .35s var(--bounce),opacity .2s;}
.btn:active{transform:scale(.97);transition-duration:.08s;}
.btn.g{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05);}
.btn.r{background:#FFE9E7;color:var(--red);}
.btn.red{background:var(--red);color:#fff;box-shadow:0 12px 26px -8px rgba(255,42,42,.6);}
.btn.sm{height:40px;width:auto;padding:0 18px;border-radius:14px;font-size:15px;box-shadow:none;}
.btns{display:flex;gap:10px;margin-top:12px;}

/* ── barra de pestañas: isla negra ── */
#nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;display:flex;justify-content:center;gap:10px;padding:0 16px;pointer-events:none;transition:transform .45s var(--spring),opacity .3s;}
#nav.hide{transform:translateY(140%);opacity:0;}
#nav>*{pointer-events:auto;}
#tabs{position:relative;flex:1;max-width:400px;display:flex;padding:6px;border-radius:30px;background:var(--isl);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 18px 40px -12px rgba(0,0,0,.5);}
#tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;border-radius:24px;background:var(--isl-3);transition:transform .5s var(--spring),width .5s var(--spring);}
#tabs button{position:relative;flex:1;height:56px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;line-height:13px;font-weight:650;color:var(--on-2);transition:color .3s;}
#tabs button svg{font-size:22px;}
#tabs button.on{color:#fff;}
#fab{width:68px;height:68px;border-radius:24px;flex:none;display:grid;place-items:center;font-size:24px;color:#fff;
  background:radial-gradient(120% 120% at 50% 20%,#FF5A4A 0%,#FF2A2A 45%,#D9101A 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 14px 30px -6px rgba(255,42,42,.7);}

/* ── segmentado ── */
.seg{position:relative;display:flex;background:var(--well-2);border-radius:16px;padding:4px;margin-bottom:16px;}
.seg button{position:relative;z-index:1;flex:1;height:36px;border-radius:12px;font-size:14px;font-weight:650;color:var(--ink-2);transition:color .3s;}
.seg button.on{color:#fff;}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:var(--isl);transition:transform .45s var(--spring);}
.seg.r2 .ind{transform:translateX(100%);}

/* ── páginas ── */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .5s var(--spring);}
.page.on{transform:none;}
.page.up{transform:translateY(100%);}
.page.up.on{transform:none;}
.ph{flex:none;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;display:flex;align-items:center;gap:10px;z-index:2;}
.ph .ttl{flex:1;min-width:0;}
.ph .ttl .a{font:700 17px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph .ttl .b{font-size:13px;line-height:17px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:6px 16px calc(env(safe-area-inset-bottom) + 200px);}
.pb>.in{max-width:560px;margin:0 auto;}

/* ── modo entreno (oscuro) ── */
#p-ses{background:#000;color:#fff;}
#p-ses .ph .ttl .b{color:var(--on-2);}
#p-ses .sq{background:var(--isl-2);box-shadow:none;}
.prog{background:var(--isl-2);border-radius:28px;padding:16px 18px 16px;margin-bottom:12px;}
.prog .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.prog .hd b{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog .hd span{font-size:13px;color:var(--on-2);white-space:nowrap;font-variant-numeric:tabular-nums;}
.exsteps{display:flex;align-items:center;margin-top:14px;}
.exsteps .d{width:26px;height:26px;border-radius:50%;border:2px solid #3A3A3D;display:grid;place-items:center;flex:none;color:#fff;font-size:13px;transition:all .4s var(--spring);}
.exsteps .d.on{background:var(--red);border-color:var(--red);box-shadow:var(--glow);}
.exsteps .d.cur{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12);}
.exsteps .ln{flex:1;height:3px;border-radius:2px;background:#3A3A3D;margin:0 3px;position:relative;overflow:hidden;}
.exsteps .ln i{position:absolute;inset:0;width:0;background:var(--red);transition:width .5s var(--spring);}
.exsteps .ln.on i{width:100%;}
.prog .now{margin-top:12px;font-size:13px;color:var(--on-2);}

.ex{background:var(--isl-2);border-radius:28px;margin-bottom:12px;overflow:hidden;transition:box-shadow .4s;}
.ex.cur{box-shadow:inset 0 0 0 1px rgba(255,42,42,.45),0 0 30px -10px rgba(255,42,42,.5);}
.ex.done{opacity:.7;}
.exh{display:flex;align-items:center;gap:10px;padding:16px 14px 2px 18px;}
.exh .nm{flex:1;min-width:0;font:700 19px/24px var(--font);letter-spacing:-.025em;}
.exh .more{color:var(--on-2);font-size:18px;width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--isl-3);flex:none;}
.prev{padding:2px 18px 10px;font-size:13px;color:var(--on-2);}
.sg{display:grid;grid-template-columns:22px 1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:4px 12px 4px 14px;transition:background .3s;}
.sg.hd{font-size:10px;color:var(--on-3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding-top:2px;padding-bottom:2px;}
.sg.hd span{text-align:center;}
.sg .n{color:var(--on-2);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;text-align:center;}
.sg input{height:44px;border-radius:14px;background:var(--isl-3);text-align:center;font-variant-numeric:tabular-nums;width:100%;font-weight:650;font-size:18px;color:#fff;transition:background .2s,box-shadow .2s;}
.sg input::placeholder{color:#55555A;}
.sg input:focus{background:#3A3A3E;box-shadow:0 0 0 2px var(--red) inset;}
.ck{width:44px;height:44px;border-radius:14px;background:var(--isl-3);display:grid;place-items:center;color:#66666B;font-size:18px;transition:background .25s,color .25s,box-shadow .25s;}
.sg.done{background:linear-gradient(90deg,rgba(255,42,42,.14),rgba(255,42,42,.04));}
.sg.done .ck{background:var(--red);color:#fff;box-shadow:var(--glow);}
.sg.done .ck svg{animation:pop .45s var(--bounce);}
@keyframes pop{0%{transform:scale(.3);}100%{transform:scale(1);}}
.sg.done input{background:transparent;}
.del{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);font-size:14px;background:var(--well);}
.exf{display:flex;justify-content:space-between;padding:10px 18px 16px;}
.exf button{font-size:15px;font-weight:650;color:#fff;}
.exf button.r{color:var(--on-2);font-weight:500;}
#p-ses .btn.g{background:var(--isl-2);color:#fff;}
.rirbar{display:flex;align-items:center;gap:6px;padding:6px 14px 10px 44px;animation:rise .4s var(--spring);}
.rirbar span{font-size:12px;color:var(--on-2);font-weight:650;margin-right:2px;white-space:nowrap;}
.rirbar button{flex:1;height:32px;border-radius:11px;background:var(--isl-3);font-size:13px;font-weight:750;color:#fff;}
.rirbar button.on{background:#fff;color:#000;}

/* editor (claro) */
#p-edit .ex{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04);}
#p-edit .exh .more{background:var(--well);color:var(--ink-2);}
#p-edit .sg.hd{color:var(--ink-2);}
#p-edit .sg .n{color:var(--ink-2);}
#p-edit .sg input{background:var(--well);color:var(--ink);}
#p-edit .sg input::placeholder{color:var(--ink-3);}
#p-edit .sg input:focus{background:#fff;}
#p-edit .exf button{color:var(--ink);}
#p-edit input.nm{color:var(--ink);}

/* ── cronómetro de descanso (isla con barra de marcas) ── */
#rest{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:45;max-width:536px;margin:0 auto;
  transform:translateY(170%) scale(.9);opacity:0;transition:transform .55s var(--spring),opacity .3s;
  background:#000;border-radius:38px;padding:16px 18px 14px;color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 24px 50px -10px rgba(0,0,0,.7),0 0 60px -20px rgba(255,42,42,.5);}
#rest.on{transform:none;opacity:1;}
.rt-scale{position:relative;height:16px;margin:0 4px 6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
.rt-scale span{position:absolute;transform:translateX(-50%);color:var(--on-2);transition:left .5s linear;}
.rt-scale span.hit{color:var(--red-2);}
.rt-ticks{display:flex;gap:4px;height:46px;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent 0,#000 10%,#000 90%,transparent);}
.rt-ticks i{flex:1;height:40px;border-radius:6px;background:#3A3A3D;transition:background .3s,height .3s;}
.rt-ticks i.f{background:linear-gradient(180deg,#FF8A4C,var(--red));}
.rt-ticks i.n{background:#FFB08A;height:44px;}
.rt-ticks i.o{background:#fff;}
.rt-ticks i.t{box-shadow:0 0 0 1.5px rgba(255,255,255,.6) inset;}
.rt-row{display:flex;align-items:center;gap:12px;margin-top:10px;}
.rt-time{flex:1;white-space:nowrap;font:300 44px/48px var(--font);letter-spacing:-.04em;color:var(--red-2);font-variant-numeric:tabular-nums;}
.rt-time small{display:block;font-size:13px;line-height:16px;font-weight:500;color:var(--on-2);letter-spacing:0;margin-left:6px;}
#rest.over .rt-time{color:#fff;}
.rt-stop{width:60px;height:60px;border-radius:50%;background:#4A1A10;display:grid;place-items:center;flex:none;transition:transform .3s var(--bounce);}
.rt-stop:active{transform:scale(.9);}
.rt-stop i{width:22px;height:22px;border-radius:6px;background:#FF7A45;box-shadow:0 0 14px rgba(255,122,69,.6);}
.rt-next{flex:1;text-align:right;min-width:0;}
.rt-next b{display:block;font-size:15px;font-weight:650;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rt-next span{font-size:12px;color:var(--on-2);font-weight:600;}
.rt-adj{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
.rt-adj button{height:26px;padding:0 9px;border-radius:9px;background:var(--isl-3);font-size:12px;font-weight:700;color:var(--on-2);}

/* ── hoja ── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
#scrim.on{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:61;max-height:90%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  background:var(--bg);border-radius:38px;transform:translateY(110%);transition:transform .55s var(--spring);box-shadow:0 -10px 50px rgba(0,0,0,.18);}
#sheet.on{transform:none;}
#sheet .gb{width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.15);margin:8px auto 0;}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 8px;}
#sheet .sh h3{margin:0;font:800 24px/30px var(--font);letter-spacing:-.04em;}
#sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px calc(env(safe-area-inset-bottom) + 16px);}
.x{width:34px;height:34px;border-radius:12px;background:var(--well-2);display:grid;place-items:center;color:var(--ink-2);font-size:12px;flex:none;}

.empty{text-align:center;color:var(--ink-2);padding:48px 24px;font-size:15px;line-height:21px;}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px;}
.kpi div{background:var(--isl);color:#fff;border-radius:22px;padding:14px;}
.kpi b{display:block;font:700 22px/28px var(--font);letter-spacing:-.035em;font-variant-numeric:tabular-nums;}
.kpi span{font-size:12px;color:var(--on-2);font-weight:600;}
.chart{background:var(--isl);border-radius:28px;padding:18px 14px 12px;margin-bottom:12px;}
.chart svg{width:100%;height:150px;display:block;overflow:visible;}
.box{background:var(--paper);border-radius:24px;padding:16px 18px;}
.steps-list{counter-reset:s;margin:6px 0 0;padding:0;list-style:none;}
.steps-list li{position:relative;padding:7px 0 7px 34px;font-size:15px;line-height:20px;}
.steps-list li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:8px;
  background:var(--isl);color:#fff;font-size:12px;line-height:24px;text-align:center;font-weight:700;}
.note{font-size:13px;line-height:18px;color:var(--ink-2);}
.h4{font-weight:700;margin:6px 0 2px;}
.cap{font-size:13px;line-height:18px;color:var(--ink-2);font-weight:650;margin:20px 8px 8px;}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);z-index:90;transform:translate(-50%,-180%) scale(.9);transition:transform .5s var(--spring);
  background:#000;color:#fff;padding:12px 20px;border-radius:22px;font-size:15px;font-weight:650;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.3);white-space:nowrap;}
#toast.on{transform:translate(-50%,0) scale(1);}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important;}#splash{display:none;}}
</style>

function clock(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+pad(m):m)+":"+pad(s);}
function dur(ms){var m=Math.round(ms/60000);return m<60?m+" min":Math.floor(m/60)+" h "+pad(m%60);}
function clone(o){return JSON.parse(JSON.stringify(o));}
var DF_DAY=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"});
var DF_SHORT=new Intl.DateTimeFormat("es-ES",{weekday:"short",day:"numeric",month:"short"});
var DF_MON=new Intl.DateTimeFormat("es-ES",{month:"long",year:"numeric"});
var DF_M=new Intl.DateTimeFormat("es-ES",{month:"short"});
function rel(t){var d=Math.round((new Date(dkey()).getTime()-new Date(dkey(new Date(t))).getTime())/864e5);
  return d<=0?"Hoy":d===1?"Ayer":d<7?"Hace "+d+" días":d<14?"Hace 1 semana":"Hace "+Math.floor(d/7)+" semanas";}
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?"ahora":m<60?m+" min":Math.round(m/60)+" h";}
function vol(sets){return sets.reduce(function(a,s){return a+(s.kg||0)*(s.r||0);},0);}
function e1rm(s){return (s.kg||0)*(1+(s.r||0)/30);}
function volTxt(v){return v>=1000?{n:fmt(Math.round(v/100)/10),u:"t"}:{n:fmtInt(v),u:"kg"};}
var toastT;
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},2000);}
function routine(id){for(var i=0;i<S.routines.length;i++)if(S.routines[i].id===id)return S.routines[i];return null;}
function lastDone(rid){for(var i=S.sessions.length-1;i>=0;i--)if(S.sessions[i].rid===rid)return S.sessions[i].end;return 0;}
function lastFor(name){for(var i=S.sessions.length-1;i>=0;i--){var se=S.sessions[i];
  for(var j=0;j<se.ex.length;j++)if(se.ex[j].name.toLowerCase()===name.toLowerCase())return {t:se.end,sets:se.ex[j].sets};}return null;}
function setsTxt(sets){return sets.map(function(s){return (s.kg!=null?fmt(s.kg)+"×":"")+(s.r!=null?s.r:"–")+(s.rir!=null?" @"+fmt(s.rir):"");}).join(" · ");}
function trainedDays(){var m={};S.sessions.forEach(function(s){m[dkey(new Date(s.start))]=1;});return m;}
function byLeast(){return S.routines.slice().sort(function(a,b){return lastDone(a.id)-lastDone(b.id);});}
/* número que cuenta hasta su valor */
function countUp(el,to){if(!el)return;var from=+(el.dataset.from||0);if(from===to){el.textContent=fmtInt(to);return;}
  var t0=performance.now(),D=900;(function f(t){var p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmtInt(from+(to-from)*e);if(p<1)requestAnimationFrame(f);})(t0);}

/* ───────── audio ───────── */
var actx=null;
function unlock(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();var b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){}}
document.addEventListener("touchend",unlock,{once:true});document.addEventListener("click",unlock,{once:true});
function beep(){try{if(!actx)return;[0,.22,.44].forEach(function(o){var g=actx.createGain(),os=actx.createOscillator();os.type="sine";os.frequency.value=880;
  g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);
  os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}

/* ───────── HOY ───────── */
var awaitSteps=false;
function rHoy(){
  var now=new Date(),today=dkey(now),st=S.steps[today]||0,goal=S.goal||10000,p=Math.min(1,st/goal),h="",i;

  if(S.active){var a=S.active;h+='<button class="live press" data-act="ses-open"><span class="dot"></span><div class="grow"><div class="t">'+esc(a.name)+'</div><div class="s num" data-live>'+clock((Date.now()-a.start)/1000)+'</div></div><span class="pill red">Continuar</span></button>';}

    +'<div style="margin-top:14px;display:flex;gap:8px">'+(awaitSteps&&!S.server?'<button class="pill red press" data-act="steps-paste">Pegar pasos</button>':'<button class="pill press" data-act="steps-sync">'+ic("sync")+'Actualizar</button>')+'<button class="pill press" data-act="steps-edit">A mano</button></div></div>'

  // SIGUIENTE: línea de metro

    +'<div class="line"><div class="tr"><i></i></div><span class="st" style="left:12px"></span><span class="st" style="left:calc(100% - 12px);background:#FF2A2A55"></span><span class="cur"></span></div>'

  // VOLUMEN: barra de marcas
  var t7=Date.now()-7*864e5,v7=0,vPrev=0;S.sessions.forEach(function(s){var vv=0;s.ex.forEach(function(e){vv+=vol(e.sets);});if(s.start>=t7)v7+=vv;else if(s.start>=t7-7*864e5)vPrev+=vv;});var vt=volTxt(v7);
  var ref=Math.max(v7,vPrev,1),nt=18,fill=Math.round(v7/ref*nt),tk="";for(i=0;i<nt;i++)tk+='<i class="'+(i<fill?"f":"")+'"></i>';

  h+='<div class="sec"><h2>Rutinas</h2><button class="lk" data-act="tab" data-id="rut">Ver todas</button></div><div class="list">'+least.slice(0,4).map(function(r){var t=lastDone(r.id);
    return '<button class="row" data-act="start" data-id="'+r.id+'"><span class="badge'+(r===nx?" hot":"")+'">'+(S.routines.indexOf(r)+1)+'</span><div class="grow"><div class="t">'+esc(r.name)+'</div><div class="s">'+r.ex.length+' ejercicios · '+(t?rel(t):"Sin hacer")+'</div></div><span class="play">'+ic("play")+'</span></button>';}).join("")+'</div>';
  $("v-hoy").firstChild.innerHTML=h;
  countUp($("stepnum"),st);shownSteps=st;
}
function heat(weeks){var now=new Date();now.setHours(0,0,0,0);var today=dkey(now),td=trainedDays();
  var start=new Date(now);start.setDate(start.getDate()-((start.getDay()+6)%7)-(weeks-1)*7);var h='<div class="heat">',lastM=-1,lastW=-9;
  for(var w=0;w<weeks;w++){var c0=new Date(start);c0.setDate(start.getDate()+w*7);var m=c0.getMonth(),lbl="";
    if(m!==lastM){if(w-lastW>=3||w===0){lbl=cap1(DF_M.format(c0).replace(".","").slice(0,3));lastW=w;}lastM=m;}
    h+='<div class="col"><b>'+lbl+'</b>';

    h+='</div>';}
  return h+'</div>';}

/* ───────── SESIÓN ───────── */
var tick=null;
function start(id){
  if(S.active){if(!confirm("Ya tienes un entreno en curso. ¿Descartarlo y empezar otro?"))return;}
  var r=routine(id);if(!r)return;
  S.active={rid:r.id,name:r.name,start:Date.now(),restAt:0,restLen:0,ex:r.ex.map(function(e){return {name:e.name,sets:e.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir,done:false};})};})};
  save();closeSheet();openSes();
}
function curEx(a){for(var i=0;i<a.ex.length;i++)if(a.ex[i].sets.some(function(s){return !s.done;}))return i;return -1;}
function openSes(){rSes();openPage("p-ses");$("nav").classList.add("hide");startTick();}
function rSes(){var a=S.active;if(!a)return;
  $("ses-name").textContent=a.name;
  var sc=$("p-ses").querySelector(".pb"),y=sc.scrollTop,ci=curEx(a),nd=0,h="";
  // isla de progreso: stepper por ejercicio
  var st="";a.ex.forEach(function(e,i){var dn=e.sets.length&&e.sets.every(function(s){return s.done;});if(dn)nd++;
    if(i)st+='<span class="ln'+(dn||i<=ci&&ci>=0?" on":"")+'"><i></i></span>';
    st+='<button class="d'+(dn?" on":"")+(i===ci?" cur":"")+'" data-act="goto" data-id="'+i+'" aria-label="'+esc(e.name)+'">'+(dn?ic("ck"):"")+'</button>';});
  h+='<div class="prog"><div class="hd"><b>'+(ci>=0?esc(a.ex[ci].name):"¡Todo hecho!")+'</b><span>'+nd+' de '+a.ex.length+'</span></div><div class="exsteps">'+st+'</div></div>';
  h+=a.ex.map(function(e,i){return exBlock(e,i,true,i===ci);}).join("");
  h+='<button class="btn g" data-act="ex-add">'+ic("plus")+' Añadir ejercicio</button>';
  h+='<div class="btns"><button class="btn red" data-act="ses-finish">Terminar entreno</button></div>';
  $("ses-body").innerHTML=h;sc.scrollTop=y;updTime();
}
function startTick(){if(tick)return;tick=setInterval(updTime,250);}
function nextInfo(a){var ci=curEx(a);if(ci<0)return {lbl:"Listo",txt:"Terminar entreno"};
  var e=a.ex[ci],k=e.sets.findIndex(function(s){return !s.done;}),anyDone=e.sets.some(function(s){return s.done;});
  return anyDone?{lbl:"Serie "+(k+1)+" de "+e.sets.length,txt:e.name}:{lbl:"Siguiente ejercicio",txt:e.name};}
function updTime(){var a=S.active;
  if(!a){clearInterval(tick);tick=null;$("rest").classList.remove("on");return;}
  var el=clock((Date.now()-a.start)/1000),done=0,tot=0;a.ex.forEach(function(e){e.sets.forEach(function(s){tot++;if(s.done)done++;});});
  var txt=el+" · "+done+"/"+tot+" series";$("ses-time").textContent=txt;
  var lv=document.querySelector("[data-live]");if(lv)lv.textContent=txt;
  var rest=$("rest"),onSes=$("p-ses").classList.contains("on");
  if(a.restAt&&onSes){
    var e=(Date.now()-a.restAt)/1000,T=a.restLen||S.rest||90,over=e>=T;
    if(over&&!rest.classList.contains("over")){rest.classList.add("over");beep();}
    if(!over)rest.classList.remove("over");
    drawTicks(e,T);
    $("rt-time").innerHTML=clock(e)+'<small>objetivo '+clock(T)+'</small>';
    var ni=nextInfo(a);$("rt-lbl").textContent=over?"¡Vamos! · "+ni.lbl:ni.lbl;$("rt-next").textContent=ni.txt;
    rest.classList.add("on");
  }else rest.classList.remove("on");
}
/* barra de marcas que avanza como un cronómetro */
function drawTicks(e,T){var N=26,spt=Math.max(2,T/20),cur=Math.floor(e/spt),start=Math.max(0,cur-17),hT=Math.round(T/spt),h="",lab="";
  for(var i=0;i<N;i++){var idx=start+i,t=idx*spt,cls=t<e?(t>=T?"o":"f"):"";if(idx===cur)cls="n";if(idx===hT)cls+=" t";h+='<i class="'+cls+'"></i>';}
  var step=T<=60?15:30;for(var s=Math.ceil(start*spt/step)*step;s<=(start+N)*spt;s+=step){if(s<=0)continue;var pos=((s/spt)-start+.5)/N*100;if(pos<4||pos>96)continue;
    lab+='<span class="'+(s<=e?"hit":"")+'" style="left:'+pos.toFixed(1)+'%">'+clock(s)+'</span>';}
  $("rt-ticks").innerHTML=h;$("rt-scale").innerHTML=lab;}
function finish(){var a=S.active;if(!a)return;
  var done=a.ex.map(function(e){return {name:e.name,sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {kg:s.kg,r:s.r,rir:s.rir};})};}).filter(function(e){return e.sets.length;});
  if(!done.length){if(confirm("No has marcado ninguna serie. ¿Descartar el entreno?")){S.active=null;save();closeSes();updTime();render();}return;}
  var prs=[];done.forEach(function(e){var best=0;S.sessions.forEach(function(se){se.ex.forEach(function(x){if(x.name.toLowerCase()===e.name.toLowerCase())x.sets.forEach(function(s){best=Math.max(best,e1rm(s));});});});
    var now=Math.max.apply(null,e.sets.map(e1rm));if(best>0&&now>best+.01)prs.push(e.name);});
  var se={id:uid(),rid:a.rid,name:a.name,start:a.start,end:Date.now(),ex:done};
  S.sessions.push(se);
  var r=routine(a.rid);if(r){r.ex=a.ex.map(function(e){var old=r.ex.filter(function(x){return x.name===e.name;})[0];
    return {id:old?old.id:uid(),name:e.name,sets:e.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir};})};});}
  S.active=null;save();updTime();closeSes();show("hoy");
  summary(se,prs);
}
function closeSes(){closePage("p-ses");$("nav").classList.remove("hide");$("rest").classList.remove("on");}
function summary(se,prs){var sets=0,v=0;se.ex.forEach(function(e){sets+=e.sets.length;v+=vol(e.sets);});var vt=volTxt(v);
  var h='<div class="kpi"><div><b>'+dur(se.end-se.start)+'</b><span>Duración</span></div><div><b>'+sets+'</b><span>Series</span></div><div><b>'+vt.n+' '+vt.u+'</b><span>Volumen</span></div></div>';
  if(prs&&prs.length)h+='<div class="box" style="margin-bottom:12px"><div class="h4">Nuevos récords</div><div style="font-size:15px;line-height:21px">'+esc(prs.join(" · "))+'</div></div>';
  h+='<button class="btn red" data-act="health" data-id="'+se.id+'">'+ic("heart")+' Guardar en Salud</button>';
  h+='<p class="foot">Usa el atajo «Entreno a Salud» (Ajustes › Conectar con Salud).</p>';
  h+='<div class="btns"><button class="btn g" data-act="sheet-close">Hecho</button></div>';
  sheet("¡Buen entreno!",h);
}
function toHealth(id){var se=S.sessions.filter(function(s){return s.id===id;})[0];if(!se)return;
  var d=new Date(se.start),payload={nombre:se.name,inicio:dkey(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes()),minutos:Math.max(1,Math.round((se.end-se.start)/60000))};
  location.href="shortcuts://run-shortcut?name="+encodeURIComponent("Entreno a Salud")+"&input=text&text="+encodeURIComponent(JSON.stringify(payload));
}

/* ───────── PROGRESO ───────── */
function rHist(){
  var h='<div class="top"><div><div class="eyebrow">'+S.sessions.length+' entrenos</div><h1>Progreso</h1></div></div><div class="seg'+(histSeg==="ex"?" r2":"")+'"><span class="ind"></span><button data-act="hseg" data-id="ses" class="'+(histSeg==="ses"?"on":"")+'">Entrenos</button><button data-act="hseg" data-id="ex" class="'+(histSeg==="ex"?"on":"")+'">Ejercicios</button></div>';
  if(!S.sessions.length){h+='<div class="empty">Aún no has terminado ningún entreno.<br>Aquí verás tus sesiones y tu progreso por ejercicio.</div>';}
  else if(histSeg==="ses"){var list=S.sessions.slice().reverse(),cur="",open=false,body="";
    list.forEach(function(s){var m=cap1(DF_MON.format(new Date(s.start)));
      if(m!==cur){if(open)body+='</div>';body+='<div class="cap">'+esc(m)+'</div><div class="list">';cur=m;open=true;}
      var n=0,v=0;s.ex.forEach(function(e){n+=e.sets.length;v+=vol(e.sets);});var vt=volTxt(v);
      body+='<button class="row" data-act="hses" data-id="'+s.id+'"><div class="grow"><div class="t">'+esc(s.name)+'</div><div class="s">'+esc(cap1(DF_SHORT.format(new Date(s.start))))+' · '+dur(s.end-s.start)+' · '+n+' series · '+vt.n+' '+vt.u+'</div></div><span class="chev">'+ic("r")+'</span></button>';});
    if(open)body+='</div>';h+='<div>'+body+'</div>';}
  else{var map={};S.sessions.forEach(function(s){s.ex.forEach(function(e){var k=e.name.toLowerCase();if(!map[k])map[k]={name:e.name,n:0,best:null};
      map[k].n++;e.sets.forEach(function(x){if(!map[k].best||e1rm(x)>e1rm(map[k].best))map[k].best=x;});});});
    var arr=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return a.name.localeCompare(b.name,"es");});
    h+='<div class="list">'+arr.map(function(x){return '<button class="row" data-act="hex" data-id="'+esc(x.name)+'"><div class="grow"><div class="t">'+esc(x.name)+'</div><div class="s">Mejor '+esc(setsTxt([x.best]))+' · '+x.n+(x.n===1?' sesión':' sesiones')+'</div></div><span class="chev">'+ic("r")+'</span></button>';}).join("")+'</div>';}
  $("v-hist").firstChild.innerHTML=h;
}
function sesSheet(id){var s=S.sessions.filter(function(x){return x.id===id;})[0];if(!s)return;
  var n=0,v=0;s.ex.forEach(function(e){n+=e.sets.length;v+=vol(e.sets);});var vt=volTxt(v);
  var h='<div class="eyebrow" style="margin:-4px 6px 12px">'+esc(DF_DAY.format(new Date(s.start)))+'</div>';
  h+='<div class="kpi"><div><b>'+dur(s.end-s.start)+'</b><span>Duración</span></div><div><b>'+n+'</b><span>Series</span></div><div><b>'+vt.n+' '+vt.u+'</b><span>Volumen</span></div></div>';
  h+='<div class="list">'+s.ex.map(function(e){return '<button class="row" data-act="hex" data-id="'+esc(e.name)+'"><div class="grow"><div class="t">'+esc(e.name)+'</div><div class="s" style="white-space:normal">'+esc(setsTxt(e.sets))+'</div></div><span class="chev">'+ic("r")+'</span></button>';}).join("")+'</div>';
  h+='<div class="btns"><button class="btn red" data-act="health" data-id="'+s.id+'">'+ic("heart")+' A Salud</button><button class="btn r" data-act="del-ses" data-id="'+s.id+'" style="flex:.6">Eliminar</button></div>';
  sheet(s.name,h);
}
function exSheet(name){var pts=[],rows=[];
  S.sessions.forEach(function(s){s.ex.forEach(function(e){if(e.name.toLowerCase()!==name.toLowerCase())return;
    var b=e.sets.reduce(function(a,x){return e1rm(x)>e1rm(a)?x:a;},e.sets[0]);pts.push({t:s.start,v:e1rm(b)});rows.push({t:s.start,sets:e.sets});});});
  var h="";
  if(pts.length){var last=pts[pts.length-1].v,first=pts[0].v,diff=last-first;
    h+='<div class="kpi" style="grid-template-columns:1fr 1fr"><div><b>'+fmt(Math.round(last))+' kg</b><span>1RM estimado</span></div><div><b style="color:'+(diff>=0?"#fff":"var(--red)")+'">'+(diff>=0?"+":"")+fmt(Math.round(diff))+' kg</b><span>Desde el inicio</span></div></div>';}
  if(pts.length>1){var W=320,H=150,P=8,mn=Math.min.apply(null,pts.map(function(p){return p.v;})),mx=Math.max.apply(null,pts.map(function(p){return p.v;}));if(mx===mn){mx+=1;mn-=1;}
    var xy=pts.map(function(p,i){return [P+i*(W-2*P)/(pts.length-1),H-P-(p.v-mn)/(mx-mn)*(H-2*P)];});
    var line=xy.map(function(q,i){if(!i)return "M"+q[0].toFixed(1)+" "+q[1].toFixed(1);var pq=xy[i-1],cx=(pq[0]+q[0])/2;return "C"+cx.toFixed(1)+" "+pq[1].toFixed(1)+" "+cx.toFixed(1)+" "+q[1].toFixed(1)+" "+q[0].toFixed(1)+" "+q[1].toFixed(1);}).join("");
    var lq=xy[xy.length-1];
    h+='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4"/></filter></defs>'
      +'<path d="'+line+' L'+lq[0]+' '+H+' L'+xy[0][0]+' '+H+'Z" fill="url(#gf)"/><path d="'+line+'" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      +'<circle cx="'+lq[0]+'" cy="'+lq[1]+'" r="9" fill="#FF2A2A" filter="url(#gl)"/><circle cx="'+lq[0]+'" cy="'+lq[1]+'" r="5" fill="#FF2A2A" stroke="#fff" stroke-width="2"/></svg></div>';}
  h+='<div class="list">'+rows.reverse().map(function(r){return '<div class="row"><div class="grow"><div class="s">'+esc(cap1(DF_SHORT.format(new Date(r.t))))+'</div><div class="t" style="white-space:normal;font-size:16px">'+esc(setsTxt(r.sets))+'</div></div></div>';}).join("")+'</div>';
  sheet(name,h);
}

function exportData(){var json=JSON.stringify(S,null,1),name="entreno-"+dkey()+".json";

  rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.routines)throw 0;S=o;if(!S.stepsAt)S.stepsAt={};save();closeSheet();render(true);toast("Copia importada");}catch(e){toast("Archivo no válido");}};rd.readAsText(f);this.value="";});

/* ───────── pasos ───────── */
var syncing=false,lastSync=0;
function syncSteps(force){if(!S.server||syncing)return;if(!force&&Date.now()-lastSync<20000)return;syncing=true;
  fetch(S.server,{cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json();}).then(function(j){
    lastSync=Date.now();S.syncErr=null;var p=j.pasos||{},chg=false;
    Object.keys(p).forEach(function(k){if(S.steps[k]!==p[k]){S.steps[k]=p[k];chg=true;}});
    if(j.actualizado&&p[dkey()]!=null){if(S.stepsAt[dkey()]!==j.actualizado)chg=true;S.stepsAt[dkey()]=j.actualizado;}
    awaitSteps=false;save();if(chg&&tab==="hoy")rHoy();
  }).catch(function(e){S.syncErr=String(e);}).then(function(){syncing=false;});}
setInterval(function(){if(!document.hidden)syncSteps();},60000);
function setSteps(n){var k=dkey();S.steps[k]=Math.round(n);S.stepsAt[k]=Date.now();save();awaitSteps=false;if(tab==="hoy")rHoy();toast(fmtInt(n)+" pasos");}
function stepsEdit(){var h='<div class="list"><div class="row"><div class="grow">Pasos de hoy</div><input inputmode="numeric" id="st-in" value="'+(S.steps[dkey()]||"")+'" placeholder="0"></div></div><div class="btns"><button class="btn" data-act="steps-save">Guardar</button></div>';
  sheet("Pasos",h);setTimeout(function(){var i=$("st-in");i&&i.focus();},350);}
document.addEventListener("visibilitychange",function(){if(!document.hidden){if(tab==="hoy")rHoy();updTime();syncSteps(awaitSteps);}});

function closePage(id){$(id).classList.remove("on");}
function sheet(title,html){$("sh-t").textContent=title;$("sh-b").innerHTML=html;$("sheet").querySelector(".sb").scrollTop=0;$("scrim").classList.add("on");$("sheet").classList.add("on");}

function ctx(el){var inSes=!!el.closest("#p-ses");return {live:inSes,list:inSes?(S.active&&S.active.ex):(ED&&ED.ex),rerender:inSes?rSes:rEdit};}

/* ───────── eventos ───────── */
document.addEventListener("input",function(ev){var t=ev.target;
  if(t.id==="ed-name"&&ED){ED.name=t.value;return;}
  var f=t.dataset.f;if(!f)return;var c=ctx(t),exEl=t.closest("[data-ex]");if(!c.list||!exEl)return;var e=c.list[+exEl.dataset.ex];
  if(f==="exname"){e.name=t.value;return;}
  var sEl=t.closest("[data-set]");if(!sEl)return;var s=e.sets[+sEl.dataset.set];
  s[f]=f==="r"?(num(t.value)==null?null:Math.round(num(t.value))):num(t.value);
  if(c.live)save();
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.tagName==="INPUT"){
  if(ev.target.id==="newex"){var b=document.querySelector('[data-act="ex-add-ok"]');b&&b.click();}
  else if(ev.target.id==="st-in"){var b2=document.querySelector('[data-act="steps-save"]');b2&&b2.click();}
  else ev.target.blur();}});

document.addEventListener("click",function(ev){
  var tb=ev.target.closest("#tabs button");if(tb){if(tb.dataset.tab!==tab){show(tb.dataset.tab);$("v-"+tab).scrollTop=0;}return;}
  var b=ev.target.closest("[data-act]");if(!b)return;var act=b.dataset.act,id=b.dataset.id;
  var c,exEl,sEl,s;
  switch(act){
  case "tab":show(id);break;
  case "quick":quick();break;
  case "settings":settings();break;
  case "sheet-close":closeSheet();break;
  case "start":ev.stopPropagation();start(id);break;
  case "ses-open":openSes();break;
  case "rut":rutSheet(id);break;
  case "new-rut":edit(null);break;
  case "edit":edit(id);break;
  case "edit-cancel":ED=null;closePage("p-edit");break;
  case "edit-save":saveEdit();break;
  case "dup":var r=routine(id);if(r){var n=clone(r);n.id=uid();n.name=r.name+" (copia)";n.ex.forEach(function(e){e.id=uid();});S.routines.push(n);save();closeSheet();render();toast("Rutina duplicada");}break;
  case "del-rut":if(confirm("¿Eliminar esta rutina? Tu historial se conserva.")){S.routines=S.routines.filter(function(r){return r.id!==id;});save();closeSheet();render();}break;
  case "goto":var t=$("ex-"+id);if(t){var sc=$("p-ses").querySelector(".pb");sc.scrollTo({top:t.offsetTop-80,behavior:"smooth"});}break;
  case "set-done":
    c=ctx(b);exEl=b.closest("[data-ex]");sEl=b.closest("[data-set]");s=c.list[+exEl.dataset.ex].sets[+sEl.dataset.set];
    c.list.forEach(function(x){x.sets.forEach(function(y){y.askRir=false;});});
    s.done=!s.done;s.askRir=s.done&&s.rir==null;
    if(s.done){S.active.restAt=Date.now();S.active.restLen=S.rest||90;$("rest").classList.remove("over");}
    save();rSes();
    break;
  case "rir":c=ctx(b);exEl=b.closest("[data-ex]");s=c.list[+exEl.dataset.ex].sets[+b.closest("[data-set]").dataset.set];
    s.rir=+id;s.askRir=false;save();rSes();break;
  case "set-add":c=ctx(b);exEl=b.closest("[data-ex]");var e=c.list[+exEl.dataset.ex],last=e.sets[e.sets.length-1];
    e.sets.push(last?{kg:last.kg,r:last.r,rir:last.rir,done:false}:{kg:null,r:null,rir:null,done:false});if(c.live)save();c.rerender();break;
  case "set-del":c=ctx(b);exEl=b.closest("[data-ex]");c.list[+exEl.dataset.ex].sets.splice(+b.closest("[data-set]").dataset.set,1);c.rerender();break;
  case "set-del-last":c=ctx(b);exEl=b.closest("[data-ex]");c.list[+exEl.dataset.ex].sets.pop();save();c.rerender();break;
  case "ex-menu":c=ctx(b);exMenu(+b.closest("[data-ex]").dataset.ex,c.live);break;
  case "mv":case "ex-del":
    var m=JSON.parse($("sh-b").dataset.menu||"{}"),L=m.live?S.active.ex:ED.ex;
    if(act==="mv"){var j=m.i+(+id);if(j>=0&&j<L.length){var tmp=L[m.i];L[m.i]=L[j];L[j]=tmp;}}
    else L.splice(m.i,1);
    if(m.live)save();(m.live?rSes:rEdit)();closeSheet();break;
  case "ex-add":c=ctx(b);addEx(c.live);break;
  case "ex-add-ok":var nm=($("newex").value||"").trim();if(!nm)return;var live=id==="1",tgt=live?S.active.ex:ED.ex;
    var src=null;S.routines.forEach(function(r){r.ex.forEach(function(e){if(!src&&e.name.toLowerCase()===nm.toLowerCase())src=e;});});
    tgt.push({id:uid(),name:nm,sets:src?src.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir,done:false};}):[{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false}]});
    if(live)save();(live?rSes:rEdit)();closeSheet();
    setTimeout(function(){var sc=$(live?"p-ses":"p-edit").querySelector(".pb");sc.scrollTo({top:sc.scrollHeight,behavior:"smooth"});},60);break;
  case "ses-finish":finish();break;
  case "ses-menu":sheet("Entreno",'<div class="list"><button class="row" data-act="ses-min"><div class="grow">Minimizar</div></button><button class="row" data-act="ses-finish"><div class="grow">Terminar y guardar</div></button><button class="row" data-act="ses-discard"><div class="grow" style="color:var(--red)">Descartar entreno</div></button></div>');break;
  case "ses-min":closeSheet();closeSes();render();break;
  case "ses-discard":if(confirm("¿Descartar este entreno? No se guardará.")){S.active=null;save();closeSheet();closeSes();updTime();render();}break;
  case "rest-add":if(S.active&&S.active.restAt){S.active.restLen=(S.active.restLen||S.rest)+15;$("rest").classList.remove("over");save();updTime();}break;
  case "rest-sub":if(S.active&&S.active.restAt){S.active.restLen=Math.max(15,(S.active.restLen||S.rest)-15);save();updTime();}break;
  case "rest-skip":if(S.active){S.active.restAt=0;save();updTime();}break;
  case "health":toHealth(id);break;
  case "hseg":if(histSeg!==id){histSeg=id;var sg=document.querySelector("#v-hist .seg");if(sg){sg.classList.toggle("r2",id==="ex");}setTimeout(function(){rHist();var l=$("v-hist").querySelector(".list");if(l){l.style.animation="rise .45s var(--spring) both";}},180);}break;
  case "hses":sesSheet(id);break;
  case "hex":exSheet(id);break;
  case "del-ses":if(confirm("¿Eliminar este entreno del historial?")){S.sessions=S.sessions.filter(function(s){return s.id!==id;});save();closeSheet();render();}break;
  case "steps-sync":awaitSteps=true;rHoy();location.href="shortcuts://run-shortcut?name="+encodeURIComponent("Pasos Entreno");break;
  case "steps-paste":
    if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){var mm=String(t).replace(/[.\s]/g,"").match(/\d+/);if(mm)setSteps(+mm[0]);else{toast("No hay pasos copiados");stepsEdit();}}).catch(function(){stepsEdit();});}
    else stepsEdit();break;
  case "steps-edit":stepsEdit();break;
  case "steps-save":var v=num($("st-in").value);if(v!=null&&v>=0){setSteps(v);closeSheet();}break;
  case "srv-test":var inp=$("set-srv");if(inp){var v2=inp.value.trim();S.server=/^https:\/\//.test(v2)?v2:"";save();}
    if(!S.server){toast("Escribe la dirección primero");break;}
    $("srv-st").textContent="Probando…";fetch(S.server,{cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json();}).then(function(j){
      var n=Object.keys(j.pasos||{}).length;$("srv-st").textContent="Conectado";toast(n?"Conectado · "+n+" días":"Conectado · aún sin pasos");syncSteps(true);
    }).catch(function(e){$("srv-st").textContent="Error";toast(e===403?"Clave incorrecta":"No se pudo conectar");});break;
  case "export":exportData();break;
  case "import":$("fin").click();break;
  case "reset":if(confirm("Se borrará todo tu historial y volverán las rutinas iniciales. ¿Seguro?")){S=seed();save();closeSheet();render(true);toast("Restaurado");}break;
  }
});

/* ───────── arranque ───────── */
(function(){var sp=$("splash"),seen=false;try{seen=sessionStorage.getItem("splash")==="1";sessionStorage.setItem("splash","1");}catch(e){}
  if(seen||/[?&]nosplash/.test(location.search)){sp.remove();return;}
  setTimeout(function(){sp.classList.add("out");setTimeout(function(){sp.remove();},700);},1150);})();
show("hoy",true);
if(S.active){openSes();}
syncSteps(true);
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
