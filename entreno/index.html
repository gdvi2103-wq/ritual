<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="theme-color" content="#F6F5F3">
<style>
:root{
  color-scheme:light;
  --bg:#F6F5F3;
  --card:#FFFFFF;
  --well:#F1EFEC;
  --well-2:#E7E4E0;
  --ink:#0E0E10;
  --ink-2:#8D8D92;
  --ink-3:#C4C2BF;
  --line:rgba(0,0,0,.06);
  --red:#FF1F1F;
  --red-soft:#FFEDEB;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 6px 24px rgba(30,20,10,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:26px;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{margin:0;height:100%;background:var(--bg);}
body{font:400 17px/22px var(--font);letter-spacing:-.022em;color:var(--ink);
  position:fixed;inset:0;overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;touch-action:manipulation;}
input{font:inherit;color:inherit;background:none;border:0;outline:none;font-size:17px;letter-spacing:inherit;-webkit-user-select:text;user-select:text;min-width:0;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px;}
svg{width:1em;height:1em;flex:none;}
.num{font-variant-numeric:tabular-nums;}

/* resplandor de marca, muy sutil */
#glow{position:fixed;z-index:0;pointer-events:none;width:120vw;height:120vw;max-width:700px;max-height:700px;right:-45vw;top:-50vw;
  background:radial-gradient(circle,rgba(255,31,31,.16) 0%,rgba(255,80,90,.07) 35%,rgba(246,245,243,0) 68%);}

/* ── vistas ── */
.view{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px);}
.view>.in{max-width:560px;margin:0 auto;}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 20px;}
h1{font:700 34px/40px var(--font);letter-spacing:-.035em;margin:0;}
.sub{color:var(--ink-2);font-size:15px;line-height:20px;margin-top:1px;}
.sub::first-letter{text-transform:uppercase;}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px;}
.sec h2{font:650 20px/26px var(--font);letter-spacing:-.025em;margin:0;}
.sec .lk{font-size:15px;color:var(--ink-2);}
.foot{font-size:13px;line-height:18px;color:var(--ink-2);margin:10px 6px 0;}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;color:var(--ink);flex:none;}
.ib:active{transform:scale(.94);}

/* ── tarjetas tipo widget ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{background:var(--card);border-radius:var(--r);padding:16px 16px 15px;box-shadow:var(--shadow);position:relative;min-height:156px;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;width:100%;overflow:hidden;}
.tile.w{grid-column:span 2;}
button.tile:active{transform:scale(.985);}
.lab{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;letter-spacing:-.015em;}
.lab svg{font-size:18px;}
.lab .dim{color:var(--ink-2);font-weight:500;}
.big{font:700 40px/44px var(--font);letter-spacing:-.045em;font-variant-numeric:tabular-nums;}
.big small{font-size:17px;font-weight:500;color:var(--ink-2);letter-spacing:-.01em;margin-left:4px;}
.mini{font-size:13px;line-height:17px;color:var(--ink-2);}
.ring{position:relative;flex:none;}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg);}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font:600 15px/1 var(--font);font-variant-numeric:tabular-nums;}

.steps-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.redring{filter:drop-shadow(0 4px 10px rgba(255,31,31,.25));}
.bars{display:flex;align-items:flex-end;gap:7px;height:52px;margin-top:14px;}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;}
.bars .b i{display:block;width:100%;max-width:22px;border-radius:6px;background:var(--well-2);min-height:5px;}
.bars .b i.ok{background:var(--ink);}
.bars .b.td i{background:var(--red);}
.bars .b span{font-size:11px;line-height:13px;color:var(--ink-3);font-weight:500;}
.bars .b.td span{color:var(--ink);font-weight:700;}
.chips{display:flex;gap:8px;margin-top:14px;}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--well);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.chip.k{background:var(--ink);color:#fff;}
.chip.r{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(255,31,31,.3);}
.chip:active{transform:scale(.96);}

.wk{display:flex;justify-content:space-between;margin-top:14px;}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;}
.wk i{width:12px;height:12px;border-radius:50%;background:var(--well-2);display:block;}
.wk i.on{background:var(--ink);}
.wk .td i{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--red);}
.wk span{font-size:10px;color:var(--ink-2);font-weight:600;}

.heat{display:flex;gap:2px;margin:14px 0 2px;justify-content:space-between;}
.heat .col{display:flex;flex-direction:column;gap:3px;align-items:center;}
.heat .col b{font-size:10px;line-height:12px;color:var(--ink-2);font-weight:600;height:14px;white-space:nowrap;width:8px;overflow:visible;}
.heat i{width:8px;height:8px;border-radius:50%;background:var(--well-2);display:block;margin:1px;}
.heat i.on{background:var(--ink);transform:scale(1.25);}
.heat i.td{background:var(--red);transform:scale(1.3);box-shadow:0 0 6px rgba(255,31,31,.6);}
.heat i.fu{background:transparent;}

.live{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--ink);color:#fff;border-radius:22px;width:100%;text-align:left;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.6s infinite;flex:none;}
@keyframes pulse{50%{opacity:.35;}}
.live .grow{flex:1;}
.live .t{font-weight:600;}
.live .s{font-size:14px;opacity:.6;}

/* ── listas ── */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
.row{display:flex;align-items:center;gap:14px;min-height:52px;padding:13px 16px;position:relative;width:100%;text-align:left;}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line);}
button.row:active{background:var(--well);}
.row .grow{flex:1;min-width:0;}
.row .t{font-size:17px;line-height:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .s{font-size:14px;line-height:19px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.chev{color:var(--ink-3);font-size:13px;}
.row input{flex:1;text-align:right;color:var(--ink-2);}
.row input.l{text-align:left;color:var(--ink);}
.play{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;flex:none;}
.badge{width:40px;height:40px;border-radius:14px;background:var(--well);display:grid;place-items:center;font:700 15px/1 var(--font);flex:none;}

/* ── botones ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:27px;
  font-weight:600;background:var(--ink);color:#fff;width:100%;transition:transform .15s,opacity .15s;}
.btn:active{transform:scale(.98);opacity:.9;}
.btn.g{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
.btn.r{background:var(--red-soft);color:var(--red);}
.btn.red{background:var(--red);color:#fff;box-shadow:0 10px 24px rgba(255,31,31,.28);}
.btn.sm{height:38px;width:auto;padding:0 18px;border-radius:19px;font-size:15px;box-shadow:none;}
.link{font-size:17px;font-weight:500;}
.link:active{opacity:.5;}
.btns{display:flex;gap:10px;margin-top:12px;}

/* ── barra de pestañas flotante ── */
#nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;display:flex;justify-content:center;gap:10px;padding:0 16px;pointer-events:none;}
#nav>*{pointer-events:auto;}
#tabs{flex:1;max-width:420px;display:flex;padding:6px;border-radius:36px;
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px rgba(30,20,10,.10),0 1px 3px rgba(0,0,0,.05);}
#tabs button{flex:1;height:58px;border-radius:29px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;line-height:13px;font-weight:600;color:var(--ink-2);transition:background .25s,color .25s;}
#tabs button svg{font-size:23px;}
#tabs button.on{background:var(--well);color:var(--ink);}
#fab{width:70px;height:70px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;color:#fff;
  background:radial-gradient(circle at 50% 45%,#FF2B2B 0%,#FF1F1F 45%,#E8121B 100%);
  box-shadow:0 10px 28px rgba(255,31,31,.38),0 0 0 6px rgba(255,255,255,.7);}
#fab:active{transform:scale(.94);}

/* ── segmentado ── */
.seg{display:flex;background:var(--well-2);border-radius:14px;padding:3px;margin-bottom:16px;}
.seg button{flex:1;height:34px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink-2);}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08);}

/* ── páginas completas ── */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .45s var(--ease);}
.page.on{transform:none;}
.page.up{transform:translateY(100%);}
.page.up.on{transform:none;}
.ph{flex:none;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;display:flex;align-items:center;gap:10px;
  background:rgba(246,245,243,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:2;}
.ph .ttl{flex:1;min-width:0;}
.ph .ttl .a{font:650 17px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph .ttl .b{font-size:13px;line-height:17px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:8px 16px calc(env(safe-area-inset-bottom) + 150px);}
.pb>.in{max-width:560px;margin:0 auto;}

/* ── ejercicios ── */
.ex{background:var(--card);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
.exh{display:flex;align-items:center;gap:10px;padding:16px 14px 4px 18px;}
.exh .nm{flex:1;min-width:0;font:650 18px/23px var(--font);letter-spacing:-.02em;}
.exh input.nm{color:var(--ink);}
.exh .more{color:var(--ink-2);font-size:18px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--well);flex:none;}
.prev{padding:0 18px 10px;font-size:13px;color:var(--ink-2);}
.sg{display:grid;grid-template-columns:24px 1fr 1fr 1fr 42px;gap:8px;align-items:center;padding:4px 12px 4px 14px;transition:background .25s;}
.sg.hd{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:2px;padding-bottom:2px;}
.sg.hd span{text-align:center;}
.sg .n{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:center;}
.sg input{height:42px;border-radius:13px;background:var(--well);text-align:center;font-variant-numeric:tabular-nums;width:100%;font-weight:600;font-size:17px;}
.sg input::placeholder{color:var(--ink-3);font-weight:500;}
.sg input:focus{background:#fff;box-shadow:0 0 0 2px var(--ink) inset;}
.ck{width:42px;height:42px;border-radius:50%;background:var(--well);display:grid;place-items:center;color:var(--ink-3);font-size:17px;transition:background .2s,color .2s,transform .15s;}
.ck:active{transform:scale(.88);}
.sg.done{background:var(--red-soft);}
.sg.done .ck{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(255,31,31,.35);}
.sg.done input{background:rgba(255,255,255,.75);}
.del{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);font-size:14px;background:var(--well);}
.exf{display:flex;justify-content:space-between;padding:10px 18px 16px;}
.exf button{font-size:15px;font-weight:600;}
.exf button.r{color:var(--ink-2);font-weight:500;}
.exf button:active{opacity:.5;}

/* RIR rápido */
.rirbar{display:flex;align-items:center;gap:6px;padding:6px 14px 8px 46px;background:var(--red-soft);}
.rirbar span{font-size:12px;color:var(--ink-2);font-weight:600;margin-right:2px;white-space:nowrap;}
.rirbar button{flex:1;height:30px;border-radius:15px;background:#fff;font-size:13px;font-weight:700;}
.rirbar button.on{background:var(--ink);color:#fff;}

/* descanso */
#rest{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:45;max-width:528px;margin:0 auto;
  transform:translateY(160%);transition:transform .45s var(--ease);display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:32px;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 16px 40px rgba(30,20,10,.16),0 1px 3px rgba(0,0,0,.06);}
#rest.on{transform:none;}
#rest .grow{flex:1;min-width:0;}
#rest .t{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#rest .s{font-size:13px;color:var(--ink-2);}
#rest .pill{height:40px;padding:0 13px;border-radius:20px;background:var(--well);font-size:14px;font-weight:600;flex:none;}
#rest .pill.k{background:var(--ink);color:#fff;}
#rest.end .t{color:var(--red);}

/* ── hoja ── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(20,15,10,.28);opacity:0;pointer-events:none;transition:opacity .35s;}
#scrim.on{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92%;display:flex;flex-direction:column;
  background:var(--bg);border-radius:30px 30px 0 0;transform:translateY(102%);transition:transform .45s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.08);}
#sheet.on{transform:none;}
#sheet .gb{width:38px;height:5px;border-radius:3px;background:var(--well-2);margin:8px auto 0;}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 8px;}
#sheet .sh h3{margin:0;font:700 22px/28px var(--font);letter-spacing:-.03em;}
#sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(env(safe-area-inset-bottom) + 22px);}
#sheet .sb>.in{max-width:560px;margin:0 auto;}
.x{width:32px;height:32px;border-radius:50%;background:var(--well-2);display:grid;place-items:center;color:var(--ink-2);font-size:12px;flex:none;}

.empty{text-align:center;color:var(--ink-2);padding:48px 24px;font-size:15px;line-height:21px;}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 14px;}
.kpi div{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);}
.kpi b{display:block;font:700 22px/28px var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.kpi span{font-size:13px;color:var(--ink-2);}
.chart{background:var(--card);border-radius:22px;padding:16px 14px 10px;margin-bottom:14px;box-shadow:var(--shadow);}
.chart svg{width:100%;height:150px;display:block;overflow:visible;}
.box{background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);}
.steps-list{counter-reset:s;margin:6px 0 0;padding:0;list-style:none;}
.steps-list li{position:relative;padding:7px 0 7px 34px;font-size:15px;line-height:20px;}
.steps-list li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--well);font-size:12px;line-height:24px;text-align:center;font-weight:700;}
.note{font-size:13px;line-height:18px;color:var(--ink-2);}
.h4{font-weight:650;margin:6px 0 2px;}
.cap{font-size:13px;line-height:18px;color:var(--ink-2);font-weight:600;margin:22px 6px 8px;}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);z-index:80;transform:translate(-50%,-180%);transition:transform .4s var(--ease);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);white-space:nowrap;}
#toast.on{transform:translate(-50%,0);}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important;}}
</style>
</head>

  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></symbol>

function fmtInt(n){return Math.round(n||0).toLocaleString("es-ES");}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function pad(n){return n<10?"0"+n:""+n;}
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function clock(sec){sec=Math.max(0,Math.round(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+pad(m):m)+":"+pad(s);}

var DF_DAY=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"});
var DF_SHORT=new Intl.DateTimeFormat("es-ES",{weekday:"short",day:"numeric",month:"short"});

  return d<=0?"Hoy":d===1?"Ayer":d<7?"Hace "+d+" días":d<14?"Hace 1 semana":"Hace "+Math.floor(d/7)+" semanas";}
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?"ahora":m<60?"hace "+m+" min":"hace "+Math.round(m/60)+" h";}
function vol(sets){return sets.reduce(function(a,s){return a+(s.kg||0)*(s.r||0);},0);}
function e1rm(s){return (s.kg||0)*(1+(s.r||0)/30);}
function volTxt(v){return v>=1000?{n:fmt(Math.round(v/100)/10),u:"t"}:{n:fmtInt(v),u:"kg"};}
var toastT;
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},2000);}

function trainedDays(){var m={};S.sessions.forEach(function(s){m[dkey(new Date(s.start))]=1;});return m;}

document.addEventListener("touchend",unlock,{once:true});document.addEventListener("click",unlock,{once:true});

  os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.2);});}catch(e){}

/* ───────── HOY ───────── */
var awaitSteps=false;
function rHoy(){
  var now=new Date(),today=dkey(now),st=S.steps[today]||0,goal=S.goal||10000,p=st/goal,h="",i;
  h+='<div class="top"><div><h1>Hoy</h1><div class="sub">'+esc(DF_DAY.format(now))+'</div></div><button class="ib" data-act="settings" aria-label="Ajustes">'+ic("gear")+'</button></div>';
  if(S.active){var a=S.active;h+='<button class="live" data-act="ses-open"><span class="dot"></span><div class="grow"><div class="t">'+esc(a.name)+'</div><div class="s num" data-live>'+clock((Date.now()-a.start)/1000)+'</div></div><span style="font-size:15px;font-weight:600">Continuar</span></button>';}
  h+='<div class="grid">';
  // pasos
  var days=[],mx=goal;for(i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var k=dkey(d),v=S.steps[k]||0;mx=Math.max(mx,v);days.push({k:k,v:v,l:"LMXJVSD"[(d.getDay()+6)%7]});}
  var at=S.stepsAt[today];
  h+='<div class="tile w"><div class="steps-top"><div><div class="lab">'+ic("steps")+'Pasos</div><div class="big" style="margin-top:14px">'+fmtInt(st)+'</div><div class="mini">de '+fmtInt(goal)+(at?' · '+ago(at):'')+'</div></div>'
    +'<div class="redring">'+ring(96,11,p,"var(--red)","var(--well)",Math.round(p*100)+'%')+'</div></div>'
    +'<div class="bars">'+days.map(function(x){return '<div class="b'+(x.k===today?" td":"")+'"><i class="'+(x.v>=goal?"ok":"")+'" style="height:'+Math.max(5,x.v/mx*34)+'px"></i><span>'+x.l+'</span></div>';}).join("")+'</div>'
    +'<div class="chips">'+(awaitSteps?'<button class="chip r" data-act="steps-paste">Pegar pasos</button>':'<button class="chip k" data-act="steps-sync">'+ic("sync")+'Actualizar</button>')
    +'<button class="chip" data-act="steps-edit">A mano</button></div></div>';
  // siguiente entreno
  var gym=S.routines.slice().sort(function(a,b){return lastDone(a.id)-lastDone(b.id);}),nx=gym[0];
  if(nx){var idx=S.routines.indexOf(nx)+1,lt=lastDone(nx.id);
    h+='<button class="tile" data-act="rut" data-id="'+nx.id+'">'+ring(50,3,.72,"var(--ink)","var(--well-2)",idx)
      +'<div><div class="lab" style="display:block;line-height:20px">'+esc(nx.name)+'</div><div class="mini" style="margin-top:2px">Siguiente · '+(lt?rel(lt):"Sin hacer")+'</div></div></button>';}
  // volumen 7 días
  var t7=Date.now()-7*864e5,v7=0;S.sessions.forEach(function(s){if(s.start>=t7)s.ex.forEach(function(e){v7+=vol(e.sets);});});var vt=volTxt(v7);
  h+='<div class="tile"><div class="lab">'+ic("bolt")+'Volumen</div><div><div class="big">'+vt.n+'<small>'+vt.u+'</small></div><div class="mini">Últimos 7 días</div></div></div>';
  // semana
  var wk=new Date(now);wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
  var ws=S.sessions.filter(function(s){return s.start>=wk.getTime();}),sets=0;ws.forEach(function(s){s.ex.forEach(function(e){sets+=e.sets.length;});});
  var td=trainedDays(),wd="";for(i=0;i<7;i++){var dd=new Date(wk);dd.setDate(wk.getDate()+i);var kk=dkey(dd);wd+='<div class="'+(kk===today?"td":"")+'"><i class="'+(td[kk]?"on":"")+'"></i><span>'+"LMXJVSD"[i]+'</span></div>';}
  h+='<div class="tile w" style="min-height:0"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="lab">'+ic("flame")+'Esta semana</div><div class="big" style="margin-top:12px">'+ws.length+'<small>'+(ws.length===1?"entreno":"entrenos")+'</small></div></div><div style="text-align:right"><div class="mini">Series</div><div style="font:700 22px/28px var(--font);letter-spacing:-.03em" class="num">'+sets+'</div></div></div><div class="wk">'+wd+'</div></div>';
  // calendario de puntos
  h+='<div class="tile w" style="min-height:0"><div class="lab">'+ic("cal")+'Constancia <span class="dim">· 15 semanas</span></div>'+heat(15)+'</div>';
  h+='</div>';
  // rutinas
  h+='<div class="sec"><h2>Empezar</h2><button class="lk" data-act="tab" data-id="rut">Ver todas</button></div><div class="list">'+gym.slice(0,4).map(function(r){var t=lastDone(r.id);
    return '<button class="row" data-act="start" data-id="'+r.id+'"><div class="grow"><div class="t">'+esc(r.name)+'</div><div class="s">'+r.ex.length+' ejercicios · '+(t?rel(t):"Sin hacer")+'</div></div><span class="play">'+ic("play")+'</span></button>';}).join("")+'</div>';
  $("v-hoy").firstChild.innerHTML=h;
}
function heat(weeks){var now=new Date();now.setHours(0,0,0,0);var today=dkey(now),td=trainedDays();
  var start=new Date(now);start.setDate(start.getDate()-((start.getDay()+6)%7)-(weeks-1)*7);var h='<div class="heat">',lastM=-1,lastW=-9;
  for(var w=0;w<weeks;w++){var c0=new Date(start);c0.setDate(start.getDate()+w*7);var m=c0.getMonth(),lbl="";
    if(m!==lastM){if(w-lastW>=3||w===0){lbl=cap1(DF_M.format(c0).replace(".","").slice(0,3));lastW=w;}lastM=m;}
    h+='<div class="col"><b>'+lbl+'</b>';
    for(var d=0;d<7;d++){var x=new Date(c0);x.setDate(c0.getDate()+d);var k=dkey(x);h+='<i class="'+(x>now?"fu":k===today?"td":td[k]?"on":"")+'"></i>';}
    h+='</div>';}
  return h+'</div>';}

var tick=null;
function start(id){
  if(S.active){if(!confirm("Ya tienes un entreno en curso. ¿Descartarlo y empezar otro?"))return;}
  var r=routine(id);if(!r)return;
  S.active={rid:r.id,name:r.name,start:Date.now(),restEnd:0,restLen:0,ex:r.ex.map(function(e){return {name:e.name,sets:e.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir,done:false};})};})};
  save();closeSheet();openSes();
}
function openSes(){rSes();openPage("p-ses");startTick();}
function rSes(){var a=S.active;if(!a)return;
  $("ses-name").textContent=a.name;
  var sc=$("p-ses").querySelector(".pb"),y=sc.scrollTop;
  var h=a.ex.map(function(e,i){return exBlock(e,i,true);}).join("");
  h+='<button class="btn g" data-act="ex-add">'+ic("plus")+' Añadir ejercicio</button>';
  $("ses-body").innerHTML=h;sc.scrollTop=y;updTime();
}
function startTick(){if(tick)return;tick=setInterval(updTime,500);}
function updTime(){var a=S.active;
  if(!a){clearInterval(tick);tick=null;$("rest").classList.remove("on");return;}
  var el=clock((Date.now()-a.start)/1000),done=0,tot=0;a.ex.forEach(function(e){e.sets.forEach(function(s){tot++;if(s.done)done++;});});
  var txt=el+" · "+done+"/"+tot+" series";
  $("ses-time").textContent=txt;
  var lv=document.querySelector("[data-live]");if(lv)lv.textContent=txt;
  var rest=$("rest");
  if(a.restEnd){var left=(a.restEnd-Date.now())/1000,len=a.restLen||S.rest||90;
    if(left<=0&&!rest.classList.contains("end")){rest.classList.add("end");beep();}
    $("rest-ring").innerHTML=ring(48,4,Math.max(0,left)/len,"var(--red)","var(--well)",'<span style="font-size:12px">'+(left>0?clock(left):"0:00")+'</span>');
    $("rest-t").textContent=left>0?"Descanso":"¡A por la siguiente!";
    $("rest-s").textContent=left>0?"Objetivo "+clock(len):"Descanso terminado";
    if(left<-8){a.restEnd=0;save();}
    rest.classList.toggle("on",!!a.restEnd&&$("p-ses").classList.contains("on"));
  }else rest.classList.remove("on","end");
}
function setRest(sec){var a=S.active;a.restEnd=Date.now()+sec*1000;a.restLen=sec;$("rest").classList.remove("end");save();updTime();}
function finish(){var a=S.active;if(!a)return;
  var done=a.ex.map(function(e){return {name:e.name,sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {kg:s.kg,r:s.r,rir:s.rir};})};}).filter(function(e){return e.sets.length;});
  if(!done.length){if(confirm("No has marcado ninguna serie. ¿Descartar el entreno?")){S.active=null;save();closePage("p-ses");updTime();render();}return;}
  var prs=[];done.forEach(function(e){var best=0;S.sessions.forEach(function(se){se.ex.forEach(function(x){if(x.name.toLowerCase()===e.name.toLowerCase())x.sets.forEach(function(s){best=Math.max(best,e1rm(s));});});});
    var now=Math.max.apply(null,e.sets.map(e1rm));if(best>0&&now>best+.01)prs.push(e.name);});
  var se={id:uid(),rid:a.rid,name:a.name,start:a.start,end:Date.now(),ex:done};
  S.sessions.push(se);
  var r=routine(a.rid);if(r){r.ex=a.ex.map(function(e){var old=r.ex.filter(function(x){return x.name===e.name;})[0];
    return {id:old?old.id:uid(),name:e.name,sets:e.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir};})};});}
  S.active=null;save();updTime();closePage("p-ses");show("hoy");
  summary(se,prs);
}
function summary(se,prs){var sets=0,v=0;se.ex.forEach(function(e){sets+=e.sets.length;v+=vol(e.sets);});var vt=volTxt(v);
  var h='<div class="kpi"><div><b>'+dur(se.end-se.start)+'</b><span>Duración</span></div><div><b>'+sets+'</b><span>Series</span></div><div><b>'+vt.n+' '+vt.u+'</b><span>Volumen</span></div></div>';
  if(prs&&prs.length)h+='<div class="box" style="margin-bottom:14px"><div class="h4">Nuevos récords</div><div style="font-size:15px;line-height:21px">'+esc(prs.join(" · "))+'</div></div>';
  h+='<button class="btn red" data-act="health" data-id="'+se.id+'">'+ic("heart")+' Guardar en Salud</button>';
  h+='<p class="foot">Usa el atajo «Entreno a Salud» (Ajustes › Conectar con Salud).</p>';
  h+='<div class="btns"><button class="btn g" data-act="sheet-close">Hecho</button></div>';
  sheet("¡Buen entreno!",h);
}
function toHealth(id){var se=S.sessions.filter(function(s){return s.id===id;})[0];if(!se)return;
  var d=new Date(se.start),payload={nombre:se.name,inicio:dkey(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes()),minutos:Math.max(1,Math.round((se.end-se.start)/60000))};
  location.href="shortcuts://run-shortcut?name="+encodeURIComponent("Entreno a Salud")+"&input=text&text="+encodeURIComponent(JSON.stringify(payload));

function sesSheet(id){var s=S.sessions.filter(function(x){return x.id===id;})[0];if(!s)return;
  var n=0,v=0;s.ex.forEach(function(e){n+=e.sets.length;v+=vol(e.sets);});var vt=volTxt(v);

  h+='<div class="kpi"><div><b>'+dur(s.end-s.start)+'</b><span>Duración</span></div><div><b>'+n+'</b><span>Series</span></div><div><b>'+vt.n+' '+vt.u+'</b><span>Volumen</span></div></div>';

  h+='<div class="btns"><button class="btn red" data-act="health" data-id="'+s.id+'">'+ic("heart")+' A Salud</button><button class="btn r" data-act="del-ses" data-id="'+s.id+'" style="flex:.6">Eliminar</button></div>';
  sheet(s.name,h);
}
function exSheet(name){var pts=[],rows=[];
  S.sessions.forEach(function(s){s.ex.forEach(function(e){if(e.name.toLowerCase()!==name.toLowerCase())return;
    var b=e.sets.reduce(function(a,x){return e1rm(x)>e1rm(a)?x:a;},e.sets[0]);pts.push({t:s.start,v:e1rm(b)});rows.push({t:s.start,sets:e.sets});});});
  var h="";
  if(pts.length){var last=pts[pts.length-1].v,first=pts[0].v,diff=last-first;
    h+='<div class="kpi" style="grid-template-columns:1fr 1fr"><div><b>'+fmt(Math.round(last))+' kg</b><span>1RM estimado</span></div><div><b style="color:'+(diff>=0?"var(--ink)":"var(--red)")+'">'+(diff>=0?"+":"")+fmt(Math.round(diff))+' kg</b><span>Desde el inicio</span></div></div>';}
  if(pts.length>1){var W=320,H=150,P=8,mn=Math.min.apply(null,pts.map(function(p){return p.v;})),mx=Math.max.apply(null,pts.map(function(p){return p.v;}));if(mx===mn){mx+=1;mn-=1;}
    var xy=pts.map(function(p,i){return [P+i*(W-2*P)/(pts.length-1),H-P-(p.v-mn)/(mx-mn)*(H-2*P)];});
    var line=xy.map(function(q,i){if(!i)return "M"+q[0].toFixed(1)+" "+q[1].toFixed(1);var pq=xy[i-1],cx=(pq[0]+q[0])/2;return "C"+cx.toFixed(1)+" "+pq[1].toFixed(1)+" "+cx.toFixed(1)+" "+q[1].toFixed(1)+" "+q[0].toFixed(1)+" "+q[1].toFixed(1);}).join("");
    var lq=xy[xy.length-1];
    h+='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E0E10" stop-opacity=".12"/><stop offset="1" stop-color="#0E0E10" stop-opacity="0"/></linearGradient></defs>'
      +'<path d="'+line+' L'+lq[0]+' '+H+' L'+xy[0][0]+' '+H+'Z" fill="url(#gf)"/><path d="'+line+'" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      +'<circle cx="'+lq[0]+'" cy="'+lq[1]+'" r="5" fill="var(--red)" stroke="#fff" stroke-width="2"/></svg></div>';}
  h+='<div class="list">'+rows.reverse().map(function(r){return '<div class="row"><div class="grow"><div class="s">'+esc(cap1(DF_SHORT.format(new Date(r.t))))+'</div><div class="t" style="white-space:normal;font-size:16px">'+esc(setsTxt(r.sets))+'</div></div></div>';}).join("")+'</div>';
  sheet(name,h);
}

  sheet(e.name||"Ejercicio",h);
  $("sh-b").dataset.menu=JSON.stringify({i:i,live:live});
  $("ren").addEventListener("change",function(){var v=this.value.trim();if(v){c[i].name=v;if(live)save();(live?rSes:rEdit)();$("sh-t").textContent=v;}});
}
function addEx(live){var h='<div class="list"><div class="row"><input class="l" id="newex" placeholder="Nombre del ejercicio" enterkeyhint="done" list="exnames"></div></div>'
  +'<datalist id="exnames">'+allNames().map(function(n){return '<option value="'+esc(n)+'">';}).join("")+'</datalist>'
  +'<div class="btns"><button class="btn" data-act="ex-add-ok" data-id="'+(live?1:0)+'">Añadir</button></div>';
  sheet("Añadir ejercicio",h);setTimeout(function(){var i=$("newex");i&&i.focus();},350);}
function allNames(){var m={};S.routines.forEach(function(r){r.ex.forEach(function(e){m[e.name]=1;});});S.sessions.forEach(function(s){s.ex.forEach(function(e){m[e.name]=1;});});return Object.keys(m).sort(function(a,b){return a.localeCompare(b,"es");});}

/* ───────── eventos ───────── */
document.addEventListener("input",function(ev){var t=ev.target;
  if(t.id==="ed-name"&&ED){ED.name=t.value;return;}
  var f=t.dataset.f;if(!f)return;var c=ctx(t),exEl=t.closest("[data-ex]");if(!c.list||!exEl)return;var e=c.list[+exEl.dataset.ex];
  if(f==="exname"){e.name=t.value;return;}
  var sEl=t.closest("[data-set]");if(!sEl)return;var s=e.sets[+sEl.dataset.set];
  s[f]=f==="r"?(num(t.value)==null?null:Math.round(num(t.value))):num(t.value);
  if(c.live)save();
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.tagName==="INPUT"){
  if(ev.target.id==="newex"){var b=document.querySelector('[data-act="ex-add-ok"]');b&&b.click();}
  else if(ev.target.id==="st-in"){var b2=document.querySelector('[data-act="steps-save"]');b2&&b2.click();}
  else ev.target.blur();}});

document.addEventListener("click",function(ev){
  var tb=ev.target.closest("#tabs button");if(tb){show(tb.dataset.tab);$("v-"+tab).scrollTop=0;return;}
  var b=ev.target.closest("[data-act]");if(!b)return;var act=b.dataset.act,id=b.dataset.id;
  var c,exEl,sEl,s;
  switch(act){
  case "tab":show(id);break;
  case "quick":quick();break;
  case "settings":settings();break;
  case "sheet-close":closeSheet();break;
  case "start":start(id);break;
  case "ses-open":openSes();break;
  case "rut":rutSheet(id);break;
  case "new-rut":edit(null);break;
  case "edit":edit(id);break;
  case "edit-cancel":ED=null;closePage("p-edit");break;
  case "edit-save":saveEdit();break;
  case "dup":var r=routine(id);if(r){var n=clone(r);n.id=uid();n.name=r.name+" (copia)";n.ex.forEach(function(e){e.id=uid();});S.routines.push(n);save();closeSheet();render();toast("Rutina duplicada");}break;
  case "del-rut":if(confirm("¿Eliminar esta rutina? Tu historial se conserva.")){S.routines=S.routines.filter(function(r){return r.id!==id;});save();closeSheet();render();}break;
  case "set-done":
    c=ctx(b);exEl=b.closest("[data-ex]");sEl=b.closest("[data-set]");s=c.list[+exEl.dataset.ex].sets[+sEl.dataset.set];
    c.list.forEach(function(x){x.sets.forEach(function(y){y.askRir=false;});});s.done=!s.done;s.askRir=s.done&&s.rir==null;save();rSes();
    if(s.done)setRest(S.rest||90);
    break;
  case "rir":c=ctx(b);exEl=b.closest("[data-ex]");s=c.list[+exEl.dataset.ex].sets[+b.closest("[data-set]").dataset.set];
    s.rir=+id;s.askRir=false;save();rSes();break;
  case "set-add":c=ctx(b);exEl=b.closest("[data-ex]");var e=c.list[+exEl.dataset.ex],last=e.sets[e.sets.length-1];
    e.sets.push(last?{kg:last.kg,r:last.r,rir:last.rir,done:false}:{kg:null,r:null,rir:null,done:false});if(c.live)save();c.rerender();break;
  case "set-del":c=ctx(b);exEl=b.closest("[data-ex]");c.list[+exEl.dataset.ex].sets.splice(+b.closest("[data-set]").dataset.set,1);c.rerender();break;
  case "set-del-last":c=ctx(b);exEl=b.closest("[data-ex]");c.list[+exEl.dataset.ex].sets.pop();save();c.rerender();break;
  case "ex-menu":c=ctx(b);exMenu(+b.closest("[data-ex]").dataset.ex,c.live);break;
  case "mv":case "ex-del":
    var m=JSON.parse($("sh-b").dataset.menu||"{}"),L=m.live?S.active.ex:ED.ex;
    if(act==="mv"){var j=m.i+(+id);if(j>=0&&j<L.length){var tmp=L[m.i];L[m.i]=L[j];L[j]=tmp;}}
    else L.splice(m.i,1);
    if(m.live)save();(m.live?rSes:rEdit)();closeSheet();break;
  case "ex-add":c=ctx(b);addEx(c.live);break;
  case "ex-add-ok":var nm=($("newex").value||"").trim();if(!nm)return;var live=id==="1",tgt=live?S.active.ex:ED.ex;
    var src=null;S.routines.forEach(function(r){r.ex.forEach(function(e){if(!src&&e.name.toLowerCase()===nm.toLowerCase())src=e;});});
    tgt.push({id:uid(),name:nm,sets:src?src.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir,done:false};}):[{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false}]});
    if(live)save();(live?rSes:rEdit)();closeSheet();
    setTimeout(function(){var sc=$(live?"p-ses":"p-edit").querySelector(".pb");sc.scrollTop=sc.scrollHeight;},50);break;
  case "ses-finish":finish();break;
  case "ses-menu":sheet("Entreno",'<div class="list"><button class="row" data-act="ses-min"><div class="grow">Minimizar</div></button><button class="row" data-act="ses-discard"><div class="grow" style="color:var(--red)">Descartar entreno</div></button></div>');break;
  case "ses-min":closeSheet();closePage("p-ses");updTime();render();break;
  case "ses-discard":if(confirm("¿Descartar este entreno? No se guardará.")){S.active=null;save();closeSheet();closePage("p-ses");updTime();render();}break;
  case "rest-add":if(S.active){S.active.restEnd=Math.max(S.active.restEnd,Date.now())+15000;S.active.restLen=(S.active.restLen||S.rest)+15;$("rest").classList.remove("end");save();updTime();}break;
  case "rest-sub":if(S.active){S.active.restEnd-=15000;save();updTime();}break;
  case "rest-skip":if(S.active){S.active.restEnd=0;save();updTime();}break;
  case "health":toHealth(id);break;
  case "hseg":histSeg=id;rHist();break;
  case "hses":sesSheet(id);break;
  case "hex":exSheet(id);break;
  case "del-ses":if(confirm("¿Eliminar este entreno del historial?")){S.sessions=S.sessions.filter(function(s){return s.id!==id;});save();closeSheet();render();}break;
  case "steps-sync":awaitSteps=true;rHoy();location.href="shortcuts://run-shortcut?name="+encodeURIComponent("Pasos Entreno");break;
  case "steps-paste":
    if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){var mm=String(t).replace(/[.\s]/g,"").match(/\d+/);if(mm)setSteps(+mm[0]);else{toast("No hay pasos copiados");stepsEdit();}}).catch(function(){stepsEdit();});}
    else stepsEdit();break;
  case "steps-edit":stepsEdit();break;
  case "steps-save":var v=num($("st-in").value);if(v!=null&&v>=0){setSteps(v);closeSheet();}break;
  case "export":exportData();break;
  case "import":$("fin").click();break;
  case "reset":if(confirm("Se borrará todo tu historial y volverán las rutinas iniciales. ¿Seguro?")){S=seed();save();closeSheet();render();toast("Restaurado");}break;
  }
});

/* ───────── arranque ───────── */
render();
if(S.active){openSes();}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
</body>
</html>
