<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entreno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light;
  --void:#000;
  --s1:#161617;
  --s2:#1F1F1F;
  --s3:#2C2C2C;
  --hair:rgba(255,255,255,.08);
  --ink:#F5F5F7;
  --mute:#8E8E93;
  --dim:#4A4A4D;
  --ember:#FFFFFF;
  --ember-2:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  --bounce:cubic-bezier(.34,1.4,.64,1);
  --top:env(safe-area-inset-top);
  --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none!important;}
html,body{margin:0;height:100%;background:var(--void);}
body{font:400 17px/22px var(--font);letter-spacing:-.02em;color:var(--ink);
  position:fixed;inset:0;overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;touch-action:manipulation;}
input{font:inherit;color:inherit;background:none;border:0;outline:none;font-size:17px;letter-spacing:inherit;-webkit-user-select:text;user-select:text;min-width:0;}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:12px;}
svg{width:1em;height:1em;flex:none;}
.num{font-variant-numeric:tabular-nums;}
.tap{transition:transform .3s var(--bounce),opacity .2s;}
.tap:active{transform:scale(.96);opacity:.8;transition-duration:.08s;}

/* ── splash ── */
#splash{position:fixed;inset:0;z-index:100;background:#000;transition:opacity .6s ease,visibility .7s;}
#splash.out{opacity:0;visibility:hidden;}
#splash i{position:absolute;left:50%;top:46%;width:160vw;height:90px;transform:translate(-50%,-50%) scaleX(.02);border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,#fff 0%,#FFC9BF 7%,var(--ember) 22%,rgba(255,45,31,.25) 45%,transparent 70%);filter:blur(5px);animation:beam 1.2s var(--spring) forwards;}
@keyframes beam{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.02) scaleY(.3);}35%{opacity:1;}100%{opacity:1;transform:translate(-50%,-50%) scaleX(1) scaleY(1);}}

/* ── vistas: llegan hasta arriba, bajo la Dynamic Island ── */
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:calc(var(--top) + 18px) 20px calc(var(--bot) + 110px);}
.view>.in{max-width:520px;margin:0 auto;transition:padding .5s var(--spring);}
body.live .view>.in{padding-top:46px;}
/* el contenido se funde bajo la barra de estado */
#fade{position:fixed;left:0;right:0;top:0;height:calc(var(--top) + 14px);z-index:15;pointer-events:none;background:linear-gradient(#000 55%,rgba(0,0,0,0));}
.reveal>*{animation:in .5s var(--spring) both;}
.reveal>*:nth-child(2){animation-delay:.05s}.reveal>*:nth-child(3){animation-delay:.1s}.reveal>*:nth-child(n+4){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;}
.date{font-size:15px;line-height:20px;color:var(--mute);font-weight:500;}
.date::first-letter{text-transform:uppercase;}
.ib{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:18px;color:var(--ink);flex:none;}
h1{font:700 34px/40px var(--font);letter-spacing:-.04em;margin:0;}
.sect{font:600 20px/26px var(--font);letter-spacing:-.03em;margin:34px 2px 12px;display:flex;justify-content:space-between;align-items:baseline;}
.sect button{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:-.01em;}
.foot{font-size:13px;line-height:18px;color:var(--mute);margin:10px 4px 0;}

/* ── héroe: lo que toca hoy, con la luz ── */
.hero{position:relative;padding:42px 0 6px;}
.ember{position:absolute;z-index:-1;pointer-events:none;width:340px;height:340px;left:50%;top:-30px;margin-left:-170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,45,31,.55) 0%,rgba(255,60,40,.22) 32%,rgba(255,45,31,.06) 52%,transparent 68%);
  filter:blur(8px);animation:breathe 5s ease-in-out infinite;}
@keyframes breathe{50%{transform:scale(1.08);opacity:.85;}}
.hero .k{font-size:17px;color:var(--mute);font-weight:500;}
.hero .name{font:800 46px/48px var(--round);letter-spacing:-.045em;margin:6px 0 14px;text-wrap:balance;}
.hero .what{font-size:15px;line-height:21px;color:var(--mute);max-width:34ch;}
.hero .what b{color:var(--ink);font-weight:500;}
.cta{display:flex;gap:10px;margin-top:26px;}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:56px;border-radius:28px;font-weight:600;font-size:17px;
  background:var(--ink);color:#000;width:100%;transition:transform .3s var(--bounce),opacity .2s;}
.btn:active{transform:scale(.97);transition-duration:.08s;}
.btn svg{font-size:15px;}
.btn.s{background:var(--s2);color:var(--ink);}
.btn.d{background:rgba(255,45,31,.14);color:#FF6B5E;}
.btn.sm{height:38px;width:auto;padding:0 18px;border-radius:19px;font-size:15px;}
.btn.round{width:56px;flex:none;padding:0;}
.btns{display:flex;gap:10px;margin-top:12px;}

/* ── bloques sobrios ── */
.blk{background:var(--s1);border-radius:24px;padding:18px 18px 16px;margin-top:12px;}
.blk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.blk .lab{font-size:15px;color:var(--mute);font-weight:500;}
.blk .act{font-size:15px;color:var(--ink);font-weight:500;}
.figure{font:700 40px/44px var(--round);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:6px;}
.figure small{font:500 17px/1 var(--font);color:var(--mute);letter-spacing:-.01em;margin-left:6px;}
.track{position:relative;height:6px;border-radius:3px;background:var(--s3);margin-top:16px;overflow:hidden;}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--ember-2),var(--ember));transition:width 1s var(--spring);}
.week{display:flex;justify-content:space-between;margin-top:16px;}
.week div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:600;width:32px;}
.week i{width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;color:#000;font-size:13px;}
.week i.on{background:var(--ink);}
.week .td i{box-shadow:0 0 0 2px var(--void),0 0 0 3.5px var(--ember);}
.week .td{color:var(--ink);}

/* ── listas ── */
.list{background:var(--s1);border-radius:22px;overflow:hidden;}
.row{display:flex;align-items:center;gap:14px;min-height:58px;padding:12px 16px;position:relative;width:100%;text-align:left;transition:background .2s;}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--hair);}
button.row:active{background:var(--s2);}
.row .grow{flex:1;min-width:0;}
.row .t{font-size:17px;line-height:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .s{font-size:14px;line-height:19px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.row .v{font-size:15px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;}
.chev{color:var(--dim);font-size:13px;}
.row input{flex:1;text-align:right;color:var(--mute);}
.row input.l{text-align:left;color:var(--ink);}
.go{width:34px;height:34px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:12px;flex:none;color:var(--ink);}

/* ── barra de pestañas: cápsula de cristal ── */
#tabs{position:fixed;left:50%;bottom:calc(var(--bot) + 8px);z-index:20;transform:translateX(-50%);display:flex;padding:5px;border-radius:32px;
  background:rgba(30,30,30,.72);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.5);transition:transform .45s var(--spring),opacity .3s;}
#tabs.hide{transform:translate(-50%,150%);opacity:0;}
#tabs .ind{position:absolute;top:5px;bottom:5px;left:5px;width:86px;border-radius:27px;background:rgba(255,255,255,.12);transition:transform .5s var(--spring);}
#tabs button{position:relative;width:86px;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;line-height:12px;font-weight:600;color:var(--mute);letter-spacing:0;transition:color .25s;}
#tabs button svg{font-size:22px;}
#tabs button.on{color:var(--ink);}

/* ── pastilla bajo la Dynamic Island cuando hay entreno en curso ── */
#island{position:fixed;left:50%;top:calc(var(--top) + 6px);z-index:30;transform:translate(-50%,-160%);transition:transform .55s var(--spring);
  display:flex;align-items:center;gap:10px;height:38px;padding:0 8px 0 14px;border-radius:19px;background:#000;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.6);font-size:14px;font-weight:600;white-space:nowrap;}
#island.on{transform:translate(-50%,0);}
#island .dot{width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);animation:pulse 1.6s infinite;}
#island .t{font-variant-numeric:tabular-nums;color:var(--ember-2);}
#island .r{height:26px;padding:0 10px;border-radius:13px;background:var(--s2);display:flex;align-items:center;font-size:13px;}
@keyframes pulse{50%{opacity:.3;}}

/* ── segmentado ── */
.seg{position:relative;display:flex;background:var(--s1);border-radius:14px;padding:3px;margin:20px 0 16px;}
.seg button{position:relative;z-index:1;flex:1;height:34px;border-radius:11px;font-size:14px;font-weight:600;color:var(--mute);transition:color .3s;}
.seg button.on{color:var(--ink);}
.seg .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:11px;background:var(--s3);transition:transform .45s var(--spring);}
.seg.r2 .ind{transform:translateX(100%);}

/* constancia */
.heat{display:flex;gap:2px;margin-top:14px;justify-content:space-between;}
.heat .col{display:flex;flex-direction:column;gap:4px;align-items:center;}
.heat .col b{font-size:10px;line-height:12px;color:var(--mute);font-weight:600;height:14px;white-space:nowrap;width:8px;}
.heat i{width:8px;height:8px;border-radius:50%;background:var(--s3);display:block;}
.heat i.on{background:var(--ink);}
.heat i.td{background:var(--ember);box-shadow:0 0 8px var(--ember);}
.heat i.fu{background:transparent;}

/* ── páginas ── */
.page{position:fixed;inset:0;z-index:40;background:var(--void);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .5s var(--spring);}
.page.on{transform:none;}
.page.up{transform:translateY(100%);}
.page.up.on{transform:none;}
.ph{flex:none;padding:calc(var(--top) + 6px) 16px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(#000 70%,rgba(0,0,0,0));position:relative;z-index:2;}
.ph .ttl{flex:1;min-width:0;text-align:center;}
.ph .ttl .a{font:600 17px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ph .ttl .b{font-size:13px;line-height:17px;color:var(--mute);font-variant-numeric:tabular-nums;}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:4px 16px calc(var(--bot) + 210px);}
.pb>.in{max-width:520px;margin:0 auto;}

/* ── entreno ── */
.exsteps{display:flex;align-items:center;margin:4px 4px 18px;}
.exsteps .d{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;flex:none;color:#000;font-size:11px;transition:all .4s var(--spring);}
.exsteps .d.on{background:var(--ink);border-color:var(--ink);}
.exsteps .d.cur{border-color:var(--ember);box-shadow:0 0 12px rgba(255,45,31,.6);}
.exsteps .ln{flex:1;height:1.5px;background:var(--dim);margin:0 3px;position:relative;}
.exsteps .ln i{position:absolute;inset:0;width:0;background:var(--ink);transition:width .5s var(--spring);}
.exsteps .ln.on i{width:100%;}

.ex{background:var(--s1);border-radius:24px;margin-bottom:10px;overflow:hidden;transition:opacity .3s;}
.ex.cur{box-shadow:inset 0 0 0 1px rgba(255,45,31,.35);}
.ex.done .exh .nm{color:var(--mute);}
.exh{display:flex;align-items:center;gap:10px;padding:16px 12px 2px 18px;}
.exh .nm{flex:1;min-width:0;font:600 19px/24px var(--font);letter-spacing:-.03em;}
.exh input.nm{color:var(--ink);}
.exh .more{color:var(--mute);font-size:17px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;flex:none;}
.prev{padding:2px 18px 10px;font-size:13px;color:var(--mute);}
.sg{display:grid;grid-template-columns:20px 1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:4px 12px 4px 16px;transition:background .3s;}
.sg.hd{font-size:12px;color:var(--mute);font-weight:500;padding-top:0;padding-bottom:0;}
.sg.hd span{text-align:center;}
.sg .n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:center;}
.sg input{height:44px;border-radius:12px;background:var(--s2);text-align:center;font:600 18px/1 var(--round);font-variant-numeric:tabular-nums;width:100%;color:var(--ink);transition:background .2s,box-shadow .2s;}
.sg input::placeholder{color:var(--dim);}
.sg input:focus{background:var(--s3);box-shadow:0 0 0 1.5px var(--ink) inset;}
.ck{width:44px;height:44px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--dim);font-size:17px;transition:background .25s,color .25s;}
.sg.done .ck{background:var(--ember);color:#fff;}
.sg.done .ck svg{animation:pop .4s var(--bounce);}
@keyframes pop{0%{transform:scale(.3);}100%{transform:scale(1);}}
.sg.done input{background:transparent;color:var(--mute);}
.del{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mute);font-size:13px;}
.exf{display:flex;justify-content:space-between;padding:8px 18px 16px;}
.exf button{font-size:15px;font-weight:500;color:var(--ink);}
.exf button.r{color:var(--mute);}
.rirbar{display:flex;align-items:center;gap:6px;padding:4px 12px 10px 44px;animation:in .35s var(--spring);}
.rirbar span{font-size:13px;color:var(--mute);margin-right:4px;white-space:nowrap;}
.rirbar button{flex:1;height:32px;border-radius:16px;background:var(--s2);font:600 14px/1 var(--round);color:var(--ink);}
.rirbar button.on{background:var(--ink);color:#000;}

/* ── cronómetro de descanso ── */
#rest{position:fixed;left:10px;right:10px;bottom:calc(var(--bot) + 10px);z-index:45;max-width:520px;margin:0 auto;
  transform:translateY(160%);transition:transform .55s var(--spring);
  background:#0A0A0A;border-radius:36px;padding:16px 18px 14px;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),0 -20px 50px rgba(0,0,0,.9);}
#rest.on{transform:none;}
.rt-scale{position:relative;height:16px;margin:0 2px 6px;font:600 12px/16px var(--round);font-variant-numeric:tabular-nums;}
.rt-scale span{position:absolute;transform:translateX(-50%);color:var(--dim);}
.rt-scale span.hit{color:var(--ember-2);}
.rt-ticks{display:flex;gap:4px;height:42px;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent);}
.rt-ticks i{flex:1;height:36px;border-radius:5px;background:#2A2A2A;}
.rt-ticks i.f{background:linear-gradient(180deg,var(--ember-2),var(--ember));}
.rt-ticks i.n{background:#FFB394;height:42px;}
.rt-ticks i.o{background:var(--ink);}
.rt-ticks i.t{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55);}
.rt-row{display:flex;align-items:center;gap:12px;margin-top:10px;}
.rt-time{flex:1;white-space:nowrap;font:300 46px/48px var(--round);letter-spacing:-.03em;color:var(--ember-2);font-variant-numeric:tabular-nums;}
.rt-time small{display:block;font:500 13px/16px var(--font);color:var(--mute);letter-spacing:0;}
#rest.over .rt-time{color:var(--ink);}
.rt-stop{width:58px;height:58px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none;transition:transform .3s var(--bounce);}
.rt-stop:active{transform:scale(.9);}
.rt-stop i{width:20px;height:20px;border-radius:5px;background:var(--ember-2);}
.rt-next{flex:1;text-align:right;min-width:0;}
.rt-next span{font-size:12px;color:var(--mute);}
.rt-next b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rt-adj{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;}
.rt-adj button{height:26px;padding:0 10px;border-radius:13px;background:var(--s2);font:600 12px/1 var(--round);color:var(--mute);}

/* ── hoja ── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .35s;}
#scrim.on{opacity:1;pointer-events:auto;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:calc(100% - var(--top) - 20px);display:flex;flex-direction:column;
  background:#0E0E0E;border-radius:32px 32px 0 0;transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:inset 0 .5px 0 rgba(255,255,255,.14);}
#sheet.on{transform:none;}
#sheet .gb{width:36px;height:5px;border-radius:3px;background:var(--s3);margin:8px auto 0;}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 6px;max-width:560px;width:100%;margin:0 auto;}
#sheet .sh h3{margin:0;font:700 22px/28px var(--font);letter-spacing:-.035em;}
#sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(var(--bot) + 18px);}
#sheet .sb>div{max-width:520px;margin:0 auto;}
#sheet .list,#sheet .blk{background:var(--s1);}
.x{width:32px;height:32px;border-radius:50%;background:var(--s2);display:grid;place-items:center;color:var(--mute);font-size:12px;flex:none;}

.empty{text-align:center;color:var(--mute);padding:56px 24px;font-size:15px;line-height:21px;}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;}
.kpi div{background:var(--s1);border-radius:20px;padding:14px;}
.kpi b{display:block;font:700 22px/28px var(--round);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.kpi span{font-size:13px;color:var(--mute);}
.chart{background:var(--s1);border-radius:24px;padding:18px 14px 12px;margin-bottom:12px;}
.chart svg{width:100%;height:150px;display:block;overflow:visible;}
.box{background:var(--s1);border-radius:22px;padding:16px 18px;}
.steps-list{counter-reset:s;margin:6px 0 0;padding:0;list-style:none;}
.steps-list li{position:relative;padding:7px 0 7px 34px;font-size:15px;line-height:20px;}
.steps-list li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;
  background:var(--s3);font:600 12px/24px var(--round);text-align:center;}
.note{font-size:13px;line-height:18px;color:var(--mute);}
.h4{font-weight:600;margin:6px 0 2px;}
.cap{font-size:13px;line-height:18px;color:var(--mute);margin:22px 6px 8px;}
#toast{position:fixed;left:50%;top:calc(var(--top) + 6px);z-index:90;transform:translate(-50%,-200%);transition:transform .5s var(--spring);
  background:#000;color:var(--ink);padding:10px 18px;border-radius:20px;font-size:15px;font-weight:600;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18);white-space:nowrap;}
#toast.on{transform:translate(-50%,0);}

function routine(id){for(var i=0;i<S.routines.length;i++)if(S.routines[i].id===id)return S.routines[i];return null;}
function lastDone(rid){for(var i=S.sessions.length-1;i>=0;i--)if(S.sessions[i].rid===rid)return S.sessions[i].end;return 0;}
function lastFor(name){for(var i=S.sessions.length-1;i>=0;i--){var se=S.sessions[i];
  for(var j=0;j<se.ex.length;j++)if(se.ex[j].name.toLowerCase()===name.toLowerCase())return {t:se.end,sets:se.ex[j].sets};}return null;}
function setsTxt(sets){return sets.map(function(s){return (s.kg!=null?fmt(s.kg)+"×":"")+(s.r!=null?s.r:"–")+(s.rir!=null?" @"+fmt(s.rir):"");}).join(",  ");}
function trainedDays(){var m={};S.sessions.forEach(function(s){m[dkey(new Date(s.start))]=1;});return m;}
function byLeast(){return S.routines.slice().sort(function(a,b){return lastDone(a.id)-lastDone(b.id);});}
function nextUp(){var gym=S.routines.filter(function(r){return !/casa/i.test(r.name);});if(!gym.length)gym=S.routines.slice();if(!gym.length)return null;
  for(var i=S.sessions.length-1;i>=0;i--){var k=gym.findIndex(function(r){return r.id===S.sessions[i].rid;});if(k>=0)return gym[(k+1)%gym.length];}return gym[0];}

  var t0=performance.now(),D=900;(function f(t){var p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmtInt(from+(to-from)*e);if(p<1)requestAnimationFrame(f);})(t0);}

  g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.18);

  // 3 · constancia por meses + semana
  var td=trainedDays(),wk=new Date(now);wk.setHours(0,0,0,0);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));

function updTime(){var a=S.active,isl=$("island");

  var el=clock((Date.now()-a.start)/1000),done=0,tot=0;a.ex.forEach(function(e){e.sets.forEach(function(s){tot++;if(s.done)done++;});});

/* barra de marcas: avanza como un cronómetro */
function drawTicks(e,T){var N=26,spt=Math.max(2,T/20),cur=Math.floor(e/spt),start=Math.max(0,cur-17),hT=Math.round(T/spt),h="",lab="";
  for(var i=0;i<N;i++){var idx=start+i,t=idx*spt,cls=t<e?(t>=T?"o":"f"):"";if(idx===cur)cls="n";if(idx===hT)cls+=" t";h+='<i class="'+cls+'"></i>';}
  var step=T<=60?15:30;for(var s=Math.ceil(start*spt/step)*step;s<=(start+N)*spt;s+=step){if(s<=0)continue;var pos=((s/spt)-start+.5)/N*100;if(pos<5||pos>95)continue;
    lab+='<span class="'+(s<=e?"hit":"")+'" style="left:'+pos.toFixed(1)+'%">'+clock(s)+'</span>';}
  $("rt-ticks").innerHTML=h;$("rt-scale").innerHTML=lab;}
function finish(){var a=S.active;if(!a)return;
  var done=a.ex.map(function(e){return {name:e.name,sets:e.sets.filter(function(s){return s.done;}).map(function(s){return {kg:s.kg,r:s.r,rir:s.rir};})};}).filter(function(e){return e.sets.length;});
  if(!done.length){if(confirm("No has marcado ninguna serie. ¿Descartar el entreno?")){S.active=null;save();closeSheet();closeSes();render();}return;}
  var prs=[];done.forEach(function(e){var best=0;S.sessions.forEach(function(se){se.ex.forEach(function(x){if(x.name.toLowerCase()===e.name.toLowerCase())x.sets.forEach(function(s){best=Math.max(best,e1rm(s));});});});
    var now=Math.max.apply(null,e.sets.map(e1rm));if(best>0&&now>best+.01)prs.push(e.name);});

function heat(weeks){var now=new Date();now.setHours(0,0,0,0);var today=dkey(now),td=trainedDays();
  var start=new Date(now);start.setDate(start.getDate()-((start.getDay()+6)%7)-(weeks-1)*7);var h='<div class="heat">',lastM=-1,lastW=-9;
  for(var w=0;w<weeks;w++){var c0=new Date(start);c0.setDate(start.getDate()+w*7);var m=c0.getMonth(),lbl="";
    if(m!==lastM){if(w-lastW>=3||w===0){lbl=cap1(DF_M.format(c0).replace(".","").slice(0,3));lastW=w;}lastM=m;}
    h+='<div class="col"><b>'+lbl+'</b>';
    for(var d=0;d<7;d++){var x=new Date(c0);x.setDate(c0.getDate()+d);var k=dkey(x);h+='<i class="'+(x>now?"fu":k===today?"td":td[k]?"on":"")+'"></i>';}
    h+='</div>';}
  return h+'</div>';}
function rHist(){

  h+='<div class="seg'+(histSeg==="ex"?" r2":"")+'"><span class="ind"></span><button data-act="hseg" data-id="ses" class="'+(histSeg==="ses"?"on":"")+'">Entrenos</button><button data-act="hseg" data-id="ex" class="'+(histSeg==="ex"?"on":"")+'">Ejercicios</button></div>';
  if(!S.sessions.length){h+='<div class="empty">Cuando termines tu primer entreno, aquí verás cada sesión y cómo mejoras en cada ejercicio.</div>';}
  else if(histSeg==="ses"){var list=S.sessions.slice().reverse(),cur="",open=false,body="";
    list.forEach(function(s){var m=cap1(DF_MON.format(new Date(s.start)));
      if(m!==cur){if(open)body+='</div>';body+='<div class="cap">'+esc(m)+'</div><div class="list">';cur=m;open=true;}

function exSheet(name){var pts=[],rows=[];
  S.sessions.forEach(function(s){s.ex.forEach(function(e){if(e.name.toLowerCase()!==name.toLowerCase())return;
    var b=e.sets.reduce(function(a,x){return e1rm(x)>e1rm(a)?x:a;},e.sets[0]);pts.push({t:s.start,v:e1rm(b)});rows.push({t:s.start,sets:e.sets});});});
  var h="";
  if(pts.length){var last=pts[pts.length-1].v,diff=last-pts[0].v;
    h+='<div class="kpi" style="grid-template-columns:1fr 1fr"><div><b>'+fmt(Math.round(last))+' kg</b><span>Máximo estimado</span></div><div><b>'+(diff>=0?"+":"")+fmt(Math.round(diff))+' kg</b><span>Desde el principio</span></div></div>';}
  if(pts.length>1){var W=320,H=150,P=8,mn=Math.min.apply(null,pts.map(function(p){return p.v;})),mx=Math.max.apply(null,pts.map(function(p){return p.v;}));if(mx===mn){mx+=1;mn-=1;}
    var xy=pts.map(function(p,i){return [P+i*(W-2*P)/(pts.length-1),H-P-(p.v-mn)/(mx-mn)*(H-2*P)];});
    var line=xy.map(function(q,i){if(!i)return "M"+q[0].toFixed(1)+" "+q[1].toFixed(1);var pq=xy[i-1],cx=(pq[0]+q[0])/2;return "C"+cx.toFixed(1)+" "+pq[1].toFixed(1)+" "+cx.toFixed(1)+" "+q[1].toFixed(1)+" "+q[0].toFixed(1)+" "+q[1].toFixed(1);}).join("");
    var lq=xy[xy.length-1];
    h+='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="5"/></filter></defs>'
      +'<path d="'+line+' L'+lq[0]+' '+H+' L'+xy[0][0]+' '+H+'Z" fill="url(#gf)"/><path d="'+line+'" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      +'<circle cx="'+lq[0]+'" cy="'+lq[1]+'" r="10" fill="#000" opacity=".25" filter="url(#gl)"/><circle cx="'+lq[0]+'" cy="'+lq[1]+'" r="4.5" fill="#000"/></svg></div>';}
  h+='<div class="list">'+rows.reverse().map(function(r){return '<div class="row"><div class="grow"><div class="s">'+esc(cap1(DF_SHORT.format(new Date(r.t))))+'</div><div class="t" style="white-space:normal;font-size:16px">'+esc(setsTxt(r.sets))+'</div></div></div>';}).join("")+'</div>';
  sheet(name,h);
}

    else L.splice(m.i,1);
    if(m.live)save();(m.live?rSes:rEdit)();closeSheet();break;
  case "ex-add":c=ctx(b);addEx(c.live);break;
  case "ex-add-ok":var nm=($("newex").value||"").trim();if(!nm)return;var live=id==="1",tgt=live?S.active.ex:ED.ex;
    var src=null;S.routines.forEach(function(r){r.ex.forEach(function(e){if(!src&&e.name.toLowerCase()===nm.toLowerCase())src=e;});});
    tgt.push({id:uid(),name:nm,sets:src?src.sets.map(function(s){return {kg:s.kg,r:s.r,rir:s.rir,done:false};}):[{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false},{kg:null,r:null,rir:null,done:false}]});
    if(live)save();(live?rSes:rEdit)();closeSheet();
    setTimeout(function(){var sc=$(live?"p-ses":"p-edit").querySelector(".pb");sc.scrollTo({top:sc.scrollHeight,behavior:"smooth"});},60);break;
  case "ses-finish":finish();break;
  case "ses-menu":sheet("Entreno",'<div class="list"><button class="row" data-act="ses-min"><div class="grow">Minimizar</div></button><button class="row" data-act="ses-finish"><div class="grow">Terminar y guardar</div></button><button class="row" data-act="ses-discard"><div class="grow" style="color:#FF6B5E">Descartar entreno</div></button></div>');break;
  case "ses-min":closeSheet();closeSes();render();break;
  case "ses-discard":if(confirm("¿Descartar este entreno? No se guardará.")){S.active=null;save();closeSheet();closeSes();render();}break;
  case "rest-add":if(S.active&&S.active.restAt){S.active.restLen=(S.active.restLen||S.rest)+15;$("rest").classList.remove("over");save();updTime();}break;
  case "rest-sub":if(S.active&&S.active.restAt){S.active.restLen=Math.max(15,(S.active.restLen||S.rest)-15);save();updTime();}break;
  case "rest-skip":if(S.active){S.active.restAt=0;save();updTime();}break;
  case "health":toHealth(id);break;
  case "hseg":if(histSeg!==id){histSeg=id;var sg=document.querySelector("#v-hist .seg");if(sg)sg.classList.toggle("r2",id==="ex");setTimeout(rHist,200);}break;
  case "hses":sesSheet(id);break;
  case "hex":exSheet(id);break;
  case "del-ses":if(confirm("¿Eliminar este entreno del historial?")){S.sessions=S.sessions.filter(function(s){return s.id!==id;});save();closeSheet();render();}break;
  case "steps-sync":awaitSteps=true;closeSheet();rHoy();location.href="shortcuts://run-shortcut?name="+encodeURIComponent("Pasos Entreno");break;
  case "steps-paste":
    if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){var mm=String(t).replace(/[.\s]/g,"").match(/\d+/);if(mm)setSteps(+mm[0]);else{toast("No hay pasos copiados");stepsEdit();}}).catch(function(){stepsEdit();});}
    else stepsEdit();break;
  case "steps-menu":stepsMenu();break;
  case "steps-edit":stepsEdit();break;
  case "steps-save":var v=num($("st-in").value);if(v!=null&&v>=0){setSteps(v);closeSheet();}break;
  case "srv-test":var inp=$("set-srv");if(inp){var v2=inp.value.trim();S.server=/^https:\/\//.test(v2)?v2:"";save();}
    if(!S.server){toast("Escribe primero la dirección");break;}
    $("srv-st").textContent="Probando…";fetch(S.server,{cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json();}).then(function(j){
      var n=Object.keys(j.pasos||{}).length;$("srv-st").textContent="Conectado";toast(n?"Conectado, "+n+" días de pasos":"Conectado, aún sin pasos");syncSteps(true);
    }).catch(function(e){$("srv-st").textContent="Error";toast(e===403?"La clave no coincide":"No se pudo conectar");});break;
  case "export":exportData();break;
  case "import":$("fin").click();break;
  case "reset":if(confirm("Se borrará todo tu historial y volverán las rutinas iniciales. ¿Seguro?")){S=seed();save();closeSheet();render(true);toast("Restaurado");}break;
  }
});

(function(){var sp=$("splash"),seen=false;try{seen=sessionStorage.getItem("splash")==="1";sessionStorage.setItem("splash","1");}catch(e){}
  if(seen||/[?&]nosplash/.test(location.search)){sp.remove();return;}
  setTimeout(function(){sp.classList.add("out");setTimeout(function(){sp.remove();},800);},1200);})();
show("hoy",true);
if(S.active){openSes();}
syncSteps(true);
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
