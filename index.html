<style>
:root{
  color-scheme:dark;
  --plane:#0B0B0E;
  --fill:rgba(255,255,255,.055);
  --fill-2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.08);
  --ink:#fff;
  --ink-2:rgba(235,235,245,.60);
  --ink-3:rgba(235,235,245,.30);
  --green:#30D158;
  --blue:#0091FF;
  --h0:rgba(255,255,255,.055);
  --h1:#434349; --h2:#57575E; --h3:#6E6E76; --h4:#8A8A92; --h5:#30D158;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --tap:44px;
  --spring:linear(0,.015,.0541,.1098,.1761,.2482,.3225,.3964,.4678,.5353,.5981,.6556,.7076,.7541,.7952,.8312,.8624,.8892,.9121,.9313,.9474,.9607,.9715,.9803,.9873,.9928,.9971,1.0002,1.0026,1.0042,1.0053,1.0059,1.0062,1.0063,1.0061,1.0058,1.0055,1.005,1.0046,1.0041,1.0037,1.0032,1.0028,1.0024,1.0021,1.0017,1.0015,1.0012,1);
}
[hidden]{display:none!important;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;height:100%;background:var(--plane);}
body{
  font:400 17px/22px var(--font);letter-spacing:-.025em;color:var(--ink);
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none;font-size:16px;letter-spacing:inherit;-webkit-user-select:text;user-select:text;}
textarea{resize:none;}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:3px;border-radius:10px;}

/* ambiente muy tenue: algo que el cristal pueda refractar */
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
#amb i{position:absolute;border-radius:50%;filter:blur(80px);}
#amb .a{width:74vw;height:74vw;left:-22vw;top:-18vh;background:#8E8E96;opacity:.16;}
#amb .b{width:60vw;height:60vw;right:-18vw;bottom:-6vh;background:#30D158;opacity:.10;}
#amb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,14,.55),rgba(11,11,14,.92) 55%,rgba(11,11,14,.97));}

/* ── barra superior: Liquid Glass sólo aquí ── */
#bar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  padding-top:env(safe-area-inset-top);
  height:calc(env(safe-area-inset-top) + 52px);
  display:flex;align-items:center;
  transition:background .3s,box-shadow .3s;
}
#bar.solid{
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  -webkit-backdrop-filter:blur(22px) saturate(180%) brightness(1.06);
          backdrop-filter:blur(22px) saturate(180%) brightness(1.06);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.10), 0 1px 12px rgba(0,0,0,.3);
}
#bar .in{max-width:480px;margin:0 auto;width:100%;padding:0 12px;display:flex;align-items:center;gap:4px;}
#bar .t{flex:1;text-align:center;font:590 17px/22px var(--font);letter-spacing:-.028em;opacity:0;transition:opacity .25s;}
#bar.solid .t{opacity:1;}
.ib{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:999px;color:var(--ink);flex:0 0 var(--tap);}
.ib svg{width:21px;height:21px;}
.ib:active{transform:scale(.9);}
.ib.back{width:auto;padding:0 10px 0 4px;gap:2px;display:flex;align-items:center;color:var(--ink);font:400 17px/22px var(--font);}
.ib.back svg{width:19px;height:19px;}

#scroll{position:relative;z-index:1;height:100%;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 58px) 0 0;}
.wrap{max-width:480px;margin:0 auto;padding:0 16px;}
.pg{display:none;} .pg.on{display:block;animation:in .3s var(--spring);}
@keyframes in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ── cabecera ── */
.head{display:flex;align-items:flex-end;gap:12px;margin:2px 0 22px;}
h1{font:700 34px/38px var(--font);letter-spacing:-.032em;margin:0;}
.sub{font:400 15px/20px var(--font);color:var(--ink-2);letter-spacing:0;margin-top:3px;}
.head .hr{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:3px;flex:0 0 auto;}
.head .n{text-align:right;}
.head .n b{display:block;font:600 19px/22px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.head .n span{display:block;font:400 12px/15px var(--font);color:var(--ink-3);letter-spacing:0;}
.head .hr button.ch{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;color:var(--ink-3);}
.head .hr button.ch svg{width:17px;height:17px;}
.head .hr .today{min-height:32px;padding:0 13px;border-radius:999px;background:var(--fill-2);font:590 14px/18px var(--font);letter-spacing:-.02em;}

.card{background:var(--fill);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px;overflow:hidden;transition:box-shadow .4s,background .4s;}
.pg > .card:last-child{margin-bottom:0;}
#p-hoy > .card:last-child{border-bottom-left-radius:0;border-bottom-right-radius:0;}
#p-hoy > .card:last-child .map{padding-bottom:calc(16px + env(safe-area-inset-bottom));}
#p-hist{padding-bottom:calc(env(safe-area-inset-bottom) + 16px);}
@supports (corner-shape:squircle){ .card{border-radius:25px;corner-shape:squircle;} }
.card.full{background:linear-gradient(180deg,rgba(48,209,88,.09),rgba(255,255,255,.045));box-shadow:inset 0 0 0 1px rgba(48,209,88,.26);}

/* ── las cinco filas ── */
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;min-height:62px;}
.row+.row{box-shadow:inset 0 1px 0 var(--line);}
.row:active{background:rgba(255,255,255,.04);}

.row .tx{flex:1;min-width:0;}
.row .nm{display:block;font:400 17px/22px var(--font);letter-spacing:-.025em;transition:color .25s;}
.row.on .nm{color:var(--ink-2);}
.row .wh{display:block;font:400 13px/17px var(--font);color:var(--ink-3);letter-spacing:0;margin-top:1px;}
.row .ck{width:28px;height:28px;flex:0 0 28px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--fill-2);display:grid;place-items:center;transition:.3s var(--spring);}
.row .ck svg{width:16px;height:16px;color:#0B0B0E;opacity:0;transform:scale(.4);transition:.3s var(--spring);}
.row.on .ck{background:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.row.on .ck svg{opacity:1;transform:none;}

.msg{font:400 14px/19px var(--font);color:var(--ink-3);letter-spacing:-.01em;padding:0 4px 14px;}
.msg.good{color:var(--green);font-weight:590;}

/* ── nota ── */
.note{padding:14px 16px;}
.note textarea{width:100%;min-height:78px;font:400 17px/24px var(--font);letter-spacing:-.02em;}
.note textarea::placeholder{color:var(--ink-3);}

/* ── mapa ── */
.map{padding:16px;}
.map .cap{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:10px;font:400 13px/18px var(--font);color:var(--ink-2);letter-spacing:0;margin-bottom:12px;}
.map .cap .go{color:var(--ink-2);font-weight:590;white-space:nowrap;}
.scr{display:block;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 2px;}
.scr::-webkit-scrollbar{height:0;}
.gw{display:inline-block;min-width:100%;}
.mo{display:block;position:relative;height:15px;font:400 10px/15px var(--font);color:var(--ink-3);letter-spacing:0;}
.mo span{position:absolute;top:0;}
.wks{display:flex;gap:3px;}
.wk{display:flex;flex-direction:column;gap:3px;}
.cl{width:13px;height:13px;border-radius:3.5px;background:var(--h0);display:block;}
.cl[data-l="1"]{background:var(--h1);} .cl[data-l="2"]{background:var(--h2);}
.cl[data-l="3"]{background:var(--h3);} .cl[data-l="4"]{background:var(--h4);}
.cl[data-l="5"]{background:var(--h5);}
.cl[data-t="1"]{box-shadow:0 0 0 1.5px var(--ink);}
.cl.void{background:transparent;}
.lg{display:flex;align-items:center;justify-content:flex-end;gap:4px;font:400 11px/14px var(--font);color:var(--ink-3);margin-top:10px;}
.lg .cl{width:11px;height:11px;}

/* ── historial ── */
.srch{display:flex;align-items:center;gap:9px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:0 16px;min-height:var(--tap);margin-bottom:14px;}
.srch svg{width:17px;height:17px;color:var(--ink-3);flex:0 0 17px;}
.srch input{flex:1;}
.day{padding:14px 16px;width:100%;text-align:left;display:block;}
.day+.day{box-shadow:inset 0 1px 0 var(--line);}
.day .dh{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.day .dd{font:590 14px/19px var(--font);letter-spacing:-.01em;}
.day .dots{display:flex;gap:4px;margin-left:auto;}
.day .dots i{width:7px;height:7px;border-radius:999px;background:var(--fill-2);}
.day .dots i.on{background:var(--ink);}
.day.full .dots i.on{background:var(--green);}
.day .tx{font:400 15px/21px var(--font);color:var(--ink-2);letter-spacing:-.02em;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;}
.day .tx mark{background:rgba(255,255,255,.22);color:var(--ink);border-radius:3px;}
.empty{text-align:center;color:var(--ink-3);font:400 15px/22px var(--font);padding:56px 24px;letter-spacing:-.02em;}

.btn{min-height:var(--tap);padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font:590 15px/20px var(--font);letter-spacing:-.02em;background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .3s var(--spring);}
.btn:active{transform:scale(.96);}
.btn.w{width:100%;}
.btn.p{background:var(--ink);box-shadow:none;color:#0B0B0E;}
.btn.d{color:#FF4245;}
.btn svg{width:17px;height:17px;}

/* ── hoja ── */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92dvh;display:flex;flex-direction:column;
  border-radius:34px 34px 0 0;background:#141418;
  box-shadow:0 -1px 0 rgba(255,255,255,.12),0 -30px 70px rgba(0,0,0,.6);
  transform:translateY(101%);transition:transform .42s var(--spring);}
.sheet.on{transform:none;}
.sheet .gb{width:36px;height:5px;border-radius:999px;background:var(--fill-2);margin:8px auto 0;flex:0 0 auto;}
.sheet .sh{padding:12px 20px 0;display:flex;align-items:center;gap:12px;flex:0 0 auto;}
.sheet h2{margin:0;flex:1;font:700 26px/32px var(--font);letter-spacing:-.03em;}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:16px 20px calc(36px + env(safe-area-inset-bottom));}
.hint{font:400 14px/20px var(--font);color:var(--ink-2);letter-spacing:-.01em;margin:0 0 18px;}
.grp{background:var(--fill);box-shadow:inset 0 0 0 1px var(--line);border-radius:18px;padding:0 14px;margin-bottom:12px;}
.f{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 0;}
.f+.f{box-shadow:inset 0 1px 0 var(--line);}
.f .dot{width:7px;height:7px;border-radius:999px;background:var(--ink-3);flex:0 0 7px;}
.f .lb{font:400 15px/20px var(--font);color:var(--ink-3);flex:0 0 62px;letter-spacing:-.02em;}
.f input{flex:1;min-width:0;}
.f input.area{font-weight:600;letter-spacing:-.025em;}
.sect{font:600 19px/24px var(--font);letter-spacing:-.03em;margin:26px 0 10px;}
.ok{font:400 13px/18px var(--font);color:var(--green);opacity:0;transition:opacity .3s;}
.ok.on{opacity:1;}

@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){
  #bar.solid{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(22,22,26,.98);}
  #amb{display:none;}
  :root{--ink-2:rgba(235,235,245,.84);--ink-3:rgba(235,235,245,.6);--line:rgba(255,255,255,.2);}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>

<script>
(function(){
"use strict";

/* ── datos ───────────────────────────────────────────────── */
var KEY="ritual.v3", mem=null;
var store={
  get:function(){ try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return mem; } },
  set:function(o){ mem=o; try{ localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){} }
};
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

var DEF=[
  {id:"negocio", name:"Negocio", floor:"Escribir a 1 cliente o lead"},
  {id:"salud", name:"Salud", floor:"Mover el cuerpo 15 min"},
  {id:"mente", name:"Mente", floor:"10 min sin pantallas"},
  {id:"dinero", name:"Dinero", floor:"Anotar lo que he gastado"},
  {id:"relaciones", name:"Relaciones", floor:"Un mensaje de verdad a alguien"}
];
var DEFNAME={negocio:"Negocio",salud:"Salud",mente:"Mente",dinero:"Dinero",relaciones:"Relaciones"};
function fresh(){
  return { v:3, areas:DEF.map(function(a){ return {id:a.id,area:a.name,name:a.floor,when:""}; }),
           days:{}, remind:"21:00", welcomed:0 };
}
var S=store.get();
if(!S||S.v!==3||!S.areas){ S=fresh(); store.set(S); }
if(!S.days) S.days={};
function save(){ store.set(S); }

/* ── fechas ──────────────────────────────────────────────── */
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var MS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function K(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function P(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function add(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function sh(k,n){ return K(add(P(k),n)); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function full(k){ var d=P(k); return cap(DIAS[d.getDay()])+", "+d.getDate()+" de "+MES[d.getMonth()]; }
function brief(k){ var d=P(k); return cap(DIAS[d.getDay()])+" "+d.getDate()+" "+MS[d.getMonth()]; }
function label(k){ return k===HOY?"Hoy":(k===sh(HOY,-1)?"Ayer":brief(k)); }
var HOY=K(new Date()), sel=HOY;

/* ── modelo ──────────────────────────────────────────────── */
function rec(k){ if(!S.days[k]) S.days[k]={d:{},n:""}; var r=S.days[k]; if(!r.d) r.d={}; return r; }
function on(k,id){ var r=S.days[k]; return !!(r&&r.d&&r.d[id]); }
function n(k){ var r=S.days[k]; if(!r) return 0; var c=0; S.areas.forEach(function(a){ if(r.d&&r.d[a.id]) c++; }); return c; }
function used(k){ var r=S.days[k]; return !!(r && (n(k)>0 || (r.n||"").trim())); }
function total(){ var c=0; for(var k in S.days) if(used(k)) c++; return c; }
function fives(){ var c=0; for(var k in S.days) if(n(k)===S.areas.length) c++; return c; }

/* ── util ────────────────────────────────────────────────── */
function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return [].slice.call((r||document).querySelectorAll(s)); }
function el(t,c,h){ var x=document.createElement(t); if(c)x.className=c; if(h!=null)x.innerHTML=h; return x; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
var hp=null;
function tap(){
  try{ if(navigator.vibrate && navigator.vibrate(8)) return; }catch(e){}
  try{
    if(!hp){ hp=document.createElement("input"); hp.type="checkbox"; hp.setAttribute("switch","");
      hp.style.cssText="position:absolute;opacity:0;width:0;height:0;pointer-events:none"; document.body.appendChild(hp); }
    hp.checked=!hp.checked; hp.dispatchEvent(new Event("change"));
  }catch(e){}
}

/* ── HOY ─────────────────────────────────────────────────── */
var PH=["¿Qué movió la aguja hoy?","¿Qué te frenó?","¿Qué harías otra vez?",
        "Una línea basta.","Escribe lo que quieras.","¿Qué aprendiste hoy?","¿Qué no diste por hecho?"];

function drawHoy(){
  var c=n(sel), t=S.areas.length;
  $("#h1").textContent = sel===HOY?"Hoy":(sel===sh(HOY,-1)?"Ayer":brief(sel));
  $("#date").textContent = full(sel);
  var isHoy = sel===HOY, tot=total();
  $("#d-t").hidden = isHoy;
  $("#count").hidden = !isHoy || !tot;
  $("#count").innerHTML = tot ? "<b>"+tot+"</b><span>día"+(tot===1?"":"s")+"</span>" : "";

  var box=$("#rows"); box.innerHTML="";
  box.classList.toggle("full", c===t);
  S.areas.forEach(function(a){
    var o=on(sel,a.id);
    var b=el("button","row"+(o?" on":""));
    b.setAttribute("aria-pressed",o?"true":"false");
    b.innerHTML='<span class="tx"><span class="nm">'+esc(a.name)+'</span>'+
                (a.when?'<span class="wh">'+esc(a.when)+'</span>':'')+'</span>'+
                '<span class="ck"><svg><use href="#i-ck"/></svg></span>';
    b.addEventListener("click",function(){
      var r=rec(sel);
      if(r.d[a.id]) delete r.d[a.id]; else r.d[a.id]=1;
      tap(); save(); drawHoy();
      if(n(sel)===t && !r.g){ r.g=1; save(); glow(); }
    });
    box.appendChild(b);
  });

  var m=$("#msg");
  if(c===t){ m.className="msg good"; m.textContent="Los cinco. Buen día."; }
  else if(c===0){
    m.className="msg";
    var y=sh(sel,-1);
    m.textContent = (sel===HOY && total()>2 && S.days[y] && !used(y))
      ? "Ayer no marcaste nada. Da igual. Hoy sí."
      : "Marca lo que hayas hecho.";
  } else { m.className="msg"; m.textContent=""; }

  var ta=$("#note"), r=S.days[sel];
  if(document.activeElement!==ta){
    ta.value=(r&&r.n)||"";
    ta.placeholder=PH[(P(sel).getDate()+P(sel).getDay())%PH.length];
  }
  drawMap();
}

function glow(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var d=el("div");
  d.style.cssText="position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;transition:opacity .32s ease;background:radial-gradient(circle at 50% 38%,rgba(48,209,88,.30),transparent 60%)";
  document.body.appendChild(d);
  requestAnimationFrame(function(){ d.style.opacity="1";
    setTimeout(function(){ d.style.opacity="0"; setTimeout(function(){ d.remove(); },380); },340); });
  try{ if(navigator.vibrate) navigator.vibrate([10,50,10,50,20]); }catch(e){}
}

$("#note").addEventListener("input",function(){
  var v=this.value;
  clearTimeout(this._t);
  this._t=setTimeout(function(){ rec(sel).n=v; save(); drawMap(); },400);
});
$("#d-p").addEventListener("click",function(){ sel=sh(sel,-1); tap(); drawHoy(); });
$("#d-t").addEventListener("click",function(){ sel=HOY; tap(); drawHoy(); });

/* ── mapa del año ────────────────────────────────────────── */
function drawMap(){
  var y=new Date().getFullYear();
  var d=new Date(y,0,1); d=add(d,-((d.getDay()+6)%7));
  var end=new Date(y,11,31);
  var wks=$("#map-wks"), mo=$("#map-mo");
  wks.innerHTML=""; mo.innerHTML="";
  var i=0, last=-1;
  while(d<=end || d.getDay()!==1){
    var col=el("div","wk");
    for(var j=0;j<7;j++){
      var k=K(d), inY=d.getFullYear()===y;
      var c=el("div","cl"+(inY?"":" void"));
      if(inY){
        var lv=n(k);
        if(lv) c.dataset.l=lv;
        if(k===HOY) c.dataset.t="1";
        if(d.getDate()<=7 && d.getMonth()!==last){
          last=d.getMonth();
          var s=el("span",null,MS[d.getMonth()]); s.style.left=(i*16)+"px"; mo.appendChild(s);
        }
      }
      col.appendChild(c); d=add(d,1);
    }
    wks.appendChild(col); i++;
    if(i>60) break;
  }
  var tot=total(), f=fives();
  $("#map-cap").textContent = tot ? (tot+" día"+(tot===1?"":"s")+(f?" · "+f+" con los cinco":"")) : "Tu año";
  requestAnimationFrame(function(){
    var sc=$("#map-scr"), t=$('.cl[data-t="1"]');
    if(!sc||!t) return;
    var x = t.getBoundingClientRect().left - sc.getBoundingClientRect().left + sc.scrollLeft;
    sc.scrollLeft = Math.max(0, x - sc.clientWidth + 46);
  });
}

/* ── HISTORIAL ───────────────────────────────────────────── */
function drawHist(){
  var q=($("#q").value||"").toLowerCase().trim();
  var box=$("#days"); box.innerHTML="";
  var ks=Object.keys(S.days).filter(used).sort().reverse();
  if(q) ks=ks.filter(function(k){ return ((S.days[k].n||"").toLowerCase().indexOf(q)>=0); });
  if(!ks.length){
    box.appendChild(el("div","empty", q?"Nada con esa palabra.":"Todavía no hay nada.<br>Marca algo hoy y aparecerá aquí."));
    return;
  }
  ks.slice(0,400).forEach(function(k){
    var b=el("button","day"+(n(k)===S.areas.length?" full":""));
    var dots=S.areas.map(function(a){ return '<i class="'+(on(k,a.id)?"on":"")+'"></i>'; }).join("");
    var txt=(S.days[k].n||"").trim();
    var body=esc(txt);
    if(q&&txt){ body=body.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }
    b.innerHTML='<span class="dh"><span class="dd">'+esc(label(k))+'</span><span class="dots">'+dots+'</span></span>'+
                (body?'<span class="tx">'+body+'</span>':'');
    b.addEventListener("click",function(){ sel=k; go("hoy"); drawHoy(); });
    box.appendChild(b);
  });
}
$("#q").addEventListener("input",drawHist);

$("#b-week").addEventListener("click",function(){
  var m=P(HOY); m=add(m,-((m.getDay()+6)%7));
  var lines=S.areas.map(function(a){
    var c=0; for(var i=0;i<7;i++){ var k=K(add(m,i)); if(k<=HOY&&on(k,a.id)) c++; }
    return a.name+": "+c;
  });
  var txt="Semana del "+P(K(m)).getDate()+" al "+P(HOY).getDate()+" de "+MES[P(HOY).getMonth()]+"\n"+lines.join("\n");
  if(navigator.share) navigator.share({text:txt}).catch(function(){});
  else { try{ navigator.clipboard.writeText(txt); alert("Copiado."); }catch(e){ alert(txt); } }
});

/* ── navegación ──────────────────────────────────────────── */
var page="hoy";
function go(p){
  page=p;
  $$(".pg").forEach(function(x){ x.classList.remove("on"); });
  $("#p-"+p).classList.add("on");
  $("#b-back").hidden = p==="hoy";
  $("#b-set").hidden  = p!=="hoy";
  $("#b-title").textContent = p==="hoy" ? (sel===HOY?"Hoy":brief(sel)) : "Historial";
  $("#scroll").scrollTop=0;
  if(p==="hist") drawHist();
}
$("#map").addEventListener("click",function(){ go("hist"); tap(); });
$("#b-back").addEventListener("click",function(){ go("hoy"); tap(); });
$("#scroll").addEventListener("scroll",function(){
  var h1=$("#p-"+page+" h1");
  var gate = h1 ? (h1.offsetTop + h1.offsetHeight - 52) : 76;
  $("#bar").classList.toggle("solid", this.scrollTop > gate);
},{passive:true});

/* ── hoja ────────────────────────────────────────────────── */
var after=null;
function sheet(title,build,onclose){
  $("#sh-t").textContent=title;
  var b=$("#sh-b"); b.innerHTML=""; b.scrollTop=0; build(b);
  after=onclose||null;
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
}
function shut(){
  $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on");
  if(after){ var f=after; after=null; setTimeout(f,120); }
}
$("#scrim").addEventListener("click",shut);
$("#sh-x").addEventListener("click",shut);

function settings(){
  sheet("Ajustes",function(b){
    b.appendChild(el("p","hint","Cinco cosas. Una por área de tu vida. Que sean tan pequeñas que puedas hacerlas el peor día del mes."));
    S.areas.forEach(function(a){
      var g=el("div","grp");
      var f0=el("div","f"); f0.appendChild(el("span","dot"));
      var i0=el("input","area"); i0.value=a.area||a.label||DEFNAME[a.id]||"Área";
      i0.addEventListener("change",function(){ a.area=i0.value.trim()||a.area; save(); });
      f0.appendChild(i0); g.appendChild(f0);
      var f1=el("div","f"); f1.appendChild(el("span","lb","Mínimo"));
      var i1=el("input"); i1.value=a.name; i1.placeholder="Algo pequeño";
      i1.addEventListener("change",function(){ a.name=i1.value.trim()||a.name; save(); drawHoy(); });
      f1.appendChild(i1); g.appendChild(f1);
      var f2=el("div","f"); f2.appendChild(el("span","lb","¿Cuándo?"));
      var i2=el("input"); i2.value=a.when||""; i2.placeholder="después del café";
      i2.addEventListener("change",function(){ a.when=i2.value.trim(); save(); drawHoy(); });
      f2.appendChild(i2); g.appendChild(f2);
      b.appendChild(g);
    });

    b.appendChild(el("h3","sect","Aviso diario"));
    b.appendChild(el("p","hint","El iPhone no deja que una web te avise sola. Esto te crea un aviso repetido en tu calendario. Se hace una vez."));
    var g2=el("div","grp"), f=el("div","f");
    f.appendChild(el("span","lb","Hora"));
    var t=el("input"); t.type="time"; t.value=S.remind||"21:00";
    t.addEventListener("change",function(){ S.remind=t.value; save(); });
    f.appendChild(t); g2.appendChild(f); b.appendChild(g2);
    var ic=el("button","btn w",'<svg><use href="#i-cal"/></svg>Ponerlo en mi calendario');
    ic.addEventListener("click",ics); b.appendChild(ic);

    b.appendChild(el("h3","sect","Copia"));
    b.appendChild(el("p","hint","Todo vive en este teléfono. Si borras el icono, se va con él."));
    var row=el("div"); row.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:8px";
    var e1=el("button","btn",'<svg><use href="#i-sh"/></svg>Exportar');
    e1.addEventListener("click",function(){
      share("ritual-"+HOY+".json","application/json",JSON.stringify(S,null,2));
    });
    var e2=el("button","btn","Importar");
    e2.addEventListener("click",function(){ $("#fin").click(); });
    row.appendChild(e1); row.appendChild(e2); b.appendChild(row);

    var w=el("button","btn w d","Empezar de cero"); w.style.marginTop="26px";
    w.addEventListener("click",function(){
      if(confirm("Se borra todo. No hay vuelta atrás.")){ S=fresh(); S.welcomed=1; save(); shut(); drawHoy(); }
    });
    b.appendChild(w);
  }, drawHoy);
}
$("#b-set").addEventListener("click",settings);

/* ── calendario / copias ─────────────────────────────────── */
function pad(x){ return ("0"+x).slice(-2); }
function ics(){
  var s=add(new Date(),1);
  var ymd=s.getFullYear()+pad(s.getMonth()+1)+pad(s.getDate());
  var hm=(S.remind||"21:00").split(":");
  var body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Ritual//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT","UID:ritual@ritual.app","DTSTAMP:"+ymd+"T000000Z",
    "DTSTART:"+ymd+"T"+pad(hm[0])+pad(hm[1])+"00","DURATION:PT5M","RRULE:FREQ=DAILY",
    "SUMMARY:Tus cinco","DESCRIPTION:Marca lo que hayas hecho y escribe una línea.",
    "BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:Tus cinco","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  share("ritual.ics","text/calendar",body);
}
function share(name,type,text){
  var blob=new Blob([text],{type:type});
  try{
    var f=new File([blob],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f]}).catch(function(){ dl(blob,name); }); return;
    }
  }catch(e){}
  dl(blob,name);
}
function dl(blob,name){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },3000);
}
$("#fin").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o.areas) throw 0;
      S=o; if(!S.days) S.days={}; S.welcomed=1; save(); shut(); drawHoy();
    }catch(err){ alert("Ese archivo no es una copia de Ritual."); }
  };
  r.readAsText(f); e.target.value="";
});

/* ── bienvenida ──────────────────────────────────────────── */
function welcome(){
  sheet("Ritual",function(b){
    b.innerHTML='<p class="hint" style="font-size:16px;line-height:24px">'+
      'Cinco cosas al día. Una por área de tu vida.<br><br>'+
      'Que sean tan pequeñas que puedas hacerlas el peor día del mes. Marcarlas es lo que funciona; no hace falta que sean las cinco.<br><br>'+
      'Debajo, una línea sobre el día. Si no sale nada, no pasa nada.<br><br>'+
      'Nada de esto sale de este teléfono.</p>';
    var a=el("button","btn w p","Poner las mías");
    a.addEventListener("click",function(){ S.welcomed=1; save(); shut(); setTimeout(settings,380); });
    var c=el("button","btn w","Empezar así"); c.style.marginTop="8px";
    c.addEventListener("click",function(){ S.welcomed=1; save(); shut(); });
    b.appendChild(a); b.appendChild(c);
  });
}

setInterval(function(){

  if(t!==HOY){ HOY=t; sel=t; drawHoy(); }
},60000);
drawHoy();
if(!S.welcomed) setTimeout(welcome,400);
if("serviceWorker" in navigator) window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();
